<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحليلات المكتبة — مسعد ماهر</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:20px}header{background:linear-gradient(135deg,#111827,#4338ca);color:#fff;padding:28px;text-align:center}.nav,.stats,.grid{display:grid;gap:10px}.nav{grid-template-columns:repeat(5,1fr);margin-bottom:15px}.nav a,.stat,.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:13px;text-decoration:none;color:#172033}.stats{grid-template-columns:repeat(4,1fr)}.stat b{display:block;font-size:25px;margin-top:7px}.bar{height:16px;background:#e8edf5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#4f46e5}.row{margin:12px 0}.row div{display:flex;justify-content:space-between;margin-bottom:5px}.muted{color:#64748b}@media(max-width:650px){.nav{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>📊 تحليلات المكتبة</h1><p>صورة سريعة عن حجم المحتوى والمجالات والجودة والمفضلة.</p></header><main class="wrap"><nav class="nav"><a href="library-final.html">🏠 الرئيسية</a><a href="library-pro.html">📚 المكتبة</a><a href="collections.html">⭐ مجموعاتي</a><a href="prompt-engineer.html">🤖 المهندس</a><a href="sources.html">🌐 المصادر</a></nav><section class="stats"><div class="stat">📦 البرومبتات<b id="total">—</b></div><div class="stat">🗂️ المجالات<b id="cats">—</b></div><div class="stat">⭐ المفضلة<b id="fav">—</b></div><div class="stat">🏆 المتوسط<b id="avg">—</b></div></section><section class="panel" style="margin-top:15px"><h2>توزيع المجالات</h2><div id="bars" class="muted">جاري التحليل...</div></section><section class="panel"><h2>جودة المحتوى</h2><div id="quality"></div></section></main><script>async function load(){const a=await fetch('data/prompts.json?'+Date.now()).then(r=>r.json()),p=a.prompts||a;document.getElementById('total').textContent=p.length;const cats={};p.forEach(x=>cats[x.category||'عام']=(cats[x.category||'عام']||0)+1);document.getElementById('cats').textContent=Object.keys(cats).length;document.getElementById('fav').textContent=JSON.parse(localStorage.getItem('mm_favorites')||'[]').length;const qs=p.map(x=>Number(x.quality_score)).filter(Boolean),avg=qs.length?qs.reduce((a,b)=>a+b,0)/qs.length:0;document.getElementById('avg').textContent=avg?avg.toFixed(1)+'/10':'—';const max=Math.max(...Object.values(cats));document.getElementById('bars').innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([k,v])=>'<div class="row"><div><span>'+k+'</span><b>'+v+'</b></div><div class="bar"><i style="width:'+(v/max*100)+'%"></i></div></div>').join('');const q={10:0,9:0,8:0,'أقل من 8':0};p.forEach(x=>{const v=Number(x.quality_score||0);if(v>=10)q[10]++;else if(v>=9)q[9]++;else if(v>=8)q[8]++;else q['أقل من 8']++});document.getElementById('quality').innerHTML=Object.entries(q).map(([k,v])=>'<div class="row"><div><span>'+k+'</span><b>'+v+'</b></div><div class="bar"><i style="width:'+(p.length?v/p.length*100:0)+'%"></i></div></div>').join('')}load().catch(()=>document.body.insertAdjacentHTML('beforeend','<p>تعذر تحميل البيانات.</p>'));</script></body></html>
