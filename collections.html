<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مجموعاتي — مكتبة مسعد ماهر</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:20px}header{background:linear-gradient(135deg,#111827,#4338ca);color:#fff;padding:28px;text-align:center}.nav,.grid{display:grid;gap:10px}.nav{grid-template-columns:repeat(6,1fr);margin-bottom:15px}.nav a,.panel,.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;text-decoration:none;color:#172033}.panel{margin-bottom:15px}.grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.card h3{margin:5px 0}.prompt{background:#f8fafc;padding:10px;border-radius:9px;max-height:130px;overflow:auto;line-height:1.7;font-size:13px}.btn{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;background:#172033;color:#fff;margin:3px}.alt{background:#e8edf5;color:#172033}.empty{text-align:center;color:#64748b;padding:40px}.status{background:#eef2ff;padding:12px;border-radius:10px;margin-bottom:12px}@media(max-width:700px){.nav{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>⭐ مجموعاتي</h1><p>مجموعاتك محفوظة سحابيًا وتظهر على الهاتف والكمبيوتر بعد تسجيل الدخول.</p></header><main class="wrap"><nav class="nav"><a href="library-final.html">🏠 الرئيسية</a><a href="library-pro.html">📚 المكتبة</a><a href="prompt-engineer.html">🤖 المهندس</a><a href="smart-search.html">🔎 البحث الذكي</a><a href="profile.html">👤 حسابي</a><a href="analytics.html">📊 التحليلات</a></nav><div id="status" class="status">جاري التحقق من الحساب...</div><section class="panel"><button class="btn" onclick="newCollection()">➕ مجموعة جديدة</button><button class="btn alt" onclick="exportData()">⬇️ تصدير</button><button class="btn alt" onclick="importData()">⬆️ استيراد</button><input id="file" type="file" accept="application/json" hidden></section><div id="app"></div></main><script type="module">import{supabase}from './supabase-client.js';
const KEY='mm_collections';let P=[],data={},user=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadPrompts(){try{const x=await fetch('data/prompts.json?'+Date.now()).then(r=>r.json());P=x.prompts||x}catch(e){P=[]}}
function localData(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
async function init(){await loadPrompts();const{data:d}=await supabase.auth.getUser();user=d?.user||null;if(!user){data=localData();$('status').innerHTML='أنت غير مسجل الدخول. <a href="auth.html">سجل الدخول</a> لاستخدام المجموعات على كل أجهزتك.';addFromUrl();return render()}$('status').textContent='☁️ المجموعات السحابية مفعلة لهذا الحساب.';await migrateLocal();await loadCloud();addFromUrl();await loadCloud();render()}
async function loadCloud(){const{data:cs,error}=await supabase.from('collections').select('id,name,description,created_at,updated_at').order('created_at',{ascending:true});if(error){$('status').textContent='تعذر تحميل المجموعات السحابية: '+error.message;return}data={};const rows=cs||[];for(const c of rows)data[c.id]={name:c.name,description:c.description||'',items:[]};if(rows.length){const ids=rows.map(c=>c.id);const{data:links}=await supabase.from('collection_prompts').select('collection_id,prompt_id').in('collection_id',ids);for(const r of links||[])(data[r.collection_id]?.items||[]).push(String(r.prompt_id))}}
async function migrateLocal(){const old=localData();const entries=Object.entries(old);if(!entries.length)return;for(const[,c]of entries){if(!c?.name)continue;const{data:created,error}=await supabase.from('collections').insert({user_id:user.id,name:String(c.name).slice(0,120)}).select('id').single();if(error){if(error.code==='23505')continue;continue}const rows=(c.items||[]).map(pid=>({collection_id:created.id,prompt_id:String(pid)}));if(rows.length)await supabase.from('collection_prompts').upsert(rows,{onConflict:'collection_id,prompt_id'})}localStorage.removeItem(KEY)}
async function newCollection(){if(!user){alert('سجل الدخول أولًا لحفظ المجموعة سحابيًا.');location.href='auth.html';return}const n=prompt('اسم المجموعة:');if(!n?.trim())return;const{error}=await supabase.from('collections').insert({user_id:user.id,name:n.trim().slice(0,120)});if(error)alert('تعذر إنشاء المجموعة: '+error.message);else{await loadCloud();render()}}
async function rename(id){if(!user)return;const n=prompt('الاسم الجديد:',data[id]?.name||'');if(!n?.trim())return;const{error}=await supabase.from('collections').update({name:n.trim().slice(0,120)}).eq('id',id);if(error)alert('تعذر التعديل: '+error.message);else{await loadCloud();render()}}
async function removeC(id){if(!user)return;if(!confirm('حذف المجموعة وكل عناصرها؟'))return;const{error}=await supabase.from('collections').delete().eq('id',id);if(error)alert('تعذر الحذف: '+error.message);else{await loadCloud();render()}}
async function del(c,id){if(!user)return;const{error}=await supabase.from('collection_prompts').delete().eq('collection_id',c).eq('prompt_id',String(id));if(error)alert('تعذر إزالة البرومبت: '+error.message);else{await loadCloud();render()}}
async function addFromUrl(){const id=new URLSearchParams(location.search).get('id');if(!id)return;if(!user){if(!Object.keys(data).length)data.c1={name:'المفضلة',items:[]};if(!data.c1.items.includes(id))data.c1.items.push(id);localStorage.setItem(KEY,JSON.stringify(data));history.replaceState(null,'','collections.html');return}let c=Object.keys(data)[0];if(!c){const{data:created,error}=await supabase.from('collections').insert({user_id:user.id,name:'المفضلة'}).select('id').single();if(error){alert('تعذر إنشاء المجموعة: '+error.message);return}c=created.id}const{error}=await supabase.from('collection_prompts').upsert({collection_id:c,prompt_id:String(id)},{onConflict:'collection_id,prompt_id'});if(error)alert('تعذر حفظ البرومبت: '+error.message);history.replaceState(null,'','collections.html')}
function render(){const app=$('app');const keys=Object.keys(data);app.innerHTML=keys.length?keys.map(id=>{const c=data[id];const items=(c.items||[]).map(pid=>P.find(x=>String(x.id)===String(pid))).filter(Boolean);return '<section class="panel"><h2>📁 '+esc(c.name)+' <button class="btn alt" onclick="rename(\''+id+'\')">تعديل</button> <button class="btn alt" onclick="removeC(\''+id+'\')">حذف</button></h2><div class="grid">'+(items.map(x=>'<article class="card"><h3>'+esc(x.title||'برومبت')+'</h3><small>'+esc(x.category||'')+'</small><div class="prompt">'+esc(x.prompt||'')+'</div><button class="btn" onclick="copyPrompt(\''+esc(String(x.id))+'\')">📋 نسخ</button><button class="btn alt" onclick="del(\''+id+'\',\''+esc(String(x.id))+'\')">إزالة</button></article>').join('')||'<div class="empty">المجموعة فارغة.</div>')+'</div></section>'}).join(''):'<div class="empty">لا توجد مجموعات بعد. أنشئ أول مجموعة.</div>'}
async function copyPrompt(id){const x=P.find(a=>String(a.id)===String(id));if(!x)return;try{await navigator.clipboard.writeText(x.prompt||'')}catch(e){const t=document.createElement('textarea');t.value=x.prompt||'';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}alert('تم النسخ ✅')}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='masad-maher-collections.json';a.click()}
function importData(){if(!user){alert('سجل الدخول أولًا لاستيراد المجموعات إلى حسابك.');return}document.getElementById('file').click()}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const incoming=JSON.parse(r.result);for(const c of Object.values(incoming)){if(!c?.name)continue;const{data:created,error}=await supabase.from('collections').insert({user_id:user.id,name:String(c.name).slice(0,120)}).select('id').single();if(!error){const rows=(c.items||[]).map(pid=>({collection_id:created.id,prompt_id:String(pid)}));if(rows.length)await supabase.from('collection_prompts').upsert(rows,{onConflict:'collection_id,prompt_id'})}}await loadCloud();render();alert('تم الاستيراد إلى حسابك السحابي ✅')}catch(_){alert('ملف غير صالح')}};r.readAsText(f)};
window.newCollection=newCollection;window.rename=rename;window.removeC=removeC;window.del=del;window.copyPrompt=copyPrompt;window.exportData=exportData;window.importData=importData;init();</script></body></html>
