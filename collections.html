<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مجموعاتي — مكتبة مسعد ماهر</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:20px}header{background:linear-gradient(135deg,#111827,#4338ca);color:#fff;padding:28px;text-align:center}.nav,.grid{display:grid;gap:10px}.nav{grid-template-columns:repeat(5,1fr);margin-bottom:15px}.nav a,.panel,.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;text-decoration:none;color:#172033}.panel{margin-bottom:15px}.grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.card h3{margin:5px 0}.prompt{background:#f8fafc;padding:10px;border-radius:9px;max-height:130px;overflow:auto;line-height:1.7;font-size:13px}.btn{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;background:#172033;color:#fff;margin:3px}.alt{background:#e8edf5;color:#172033}.empty{text-align:center;color:#64748b;padding:40px}@media(max-width:600px){.nav{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>⭐ مجموعاتي</h1><p>احفظ البرومبتات في مجموعاتك الخاصة على جهازك.</p></header><main class="wrap"><nav class="nav"><a href="library-final.html">🏠 الرئيسية</a><a href="library-pro.html">📚 المكتبة</a><a href="prompt-engineer.html">🤖 المهندس</a><a href="smart-search.html">🔎 البحث الذكي</a><a href="analytics.html">📊 التحليلات</a></nav><section class="panel"><button class="btn" onclick="newCollection()">➕ مجموعة جديدة</button><button class="btn alt" onclick="exportData()">⬇️ تصدير</button><button class="btn alt" onclick="importData()">⬆️ استيراد</button><input id="file" type="file" accept="application/json" hidden></section><div id="app"></div></main><script>const KEY='mm_collections';let data=JSON.parse(localStorage.getItem(KEY)||'{}');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function newCollection(){const n=prompt('اسم المجموعة:');if(n){const id='c_'+Date.now();data[id]={name:n,items:[]};save()}}function addFromUrl(){const u=new URLSearchParams(location.search),id=u.get('id');if(!id)return;let c=Object.keys(data)[0];if(!c){data.c1={name:'المفضلة',items:[]};c='c1'}if(!data[c].items.includes(id))data[c].items.push(id);save();history.replaceState(null,'','collections.html')}async function render(){const app=document.getElementById('app');let p=[];try{const x=await fetch('data/prompts.json?'+Date.now()).then(r=>r.json());p=x.prompts||x}catch(e){}app.innerHTML=Object.keys(data).length?Object.entries(data).map(([id,c])=>'<section class="panel"><h2>📁 '+esc(c.name)+' <button class="btn alt" onclick="rename(\''+id+'\')">تعديل</button> <button class="btn alt" onclick="removeC(\''+id+'\')">حذف</button></h2><div class="grid">'+(c.items.map(pid=>p.find(x=>String(x.id)===String(pid))).filter(Boolean).map(x=>'<article class="card"><h3>'+esc(x.title||'برومبت')+'</h3><small>'+esc(x.category||'')+'</small><div class="prompt">'+esc(x.prompt||'')+'</div><button class="btn" onclick="copy(\''+esc(String(x.id))+'\')">📋 نسخ</button><button class="btn alt" onclick="del(\''+id+'\',\''+esc(String(x.id))+'\')">إزالة</button></article>').join('')||'<div class="empty">المجموعة فارغة.</div>')+'</div></section>').join(''):'<div class="empty">لا توجد مجموعات بعد. أنشئ أول مجموعة.</div>'}function rename(id){const n=prompt('الاسم الجديد:',data[id].name);if(n){data[id].name=n;save()}}function removeC(id){if(confirm('حذف المجموعة؟')){delete data[id];save()}}function del(c,id){data[c].items=data[c].items.filter(x=>String(x)!==String(id));save()}async function copy(id){let p=await fetch('data/prompts.json').then(r=>r.json());p=p.prompts||p;let x=p.find(a=>String(a.id)===String(id));if(x){navigator.clipboard?.writeText(x.prompt||'');alert('تم النسخ ✅')}}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='masad-maher-collections.json';a.click()}function importData(){document.getElementById('file').click()}document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save()}catch(_){alert('ملف غير صالح')}};r.readAsText(f)}addFromUrl();render();</script></body></html>
