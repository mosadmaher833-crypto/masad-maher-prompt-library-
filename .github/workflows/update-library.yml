name: Update Prompt Library

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prompt-library-update
  cancel-in-progress: true

jobs:
  update-library:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify workflow is running
        run: |
          echo "Workflow run started successfully."
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
          python --version

      - name: Validate existing library data
        run: python scripts/validate_library.py

      - name: Discover prompts from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_prompt_connector.py

      - name: Discover prompts from Lexica
        run: python scripts/lexica_prompt_connector.py

      - name: Discover prompts from Civitai
        run: python scripts/civitai_prompt_connector.py

      - name: Discover licensed prompts from official educational GitHub sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/official_github_prompt_connector.py

      - name: Discover official model prompt examples
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/official_model_prompt_connector.py

      - name: Import and publish candidates from enabled connectors
        run: python scripts/update-library.py

      - name: Validate imported library data
        run: python scripts/validate_library.py

      - name: Record run status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          path = Path('data/update-log.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          data['workflow'] = {
              'status': 'completed',
              'event': '${{ github.event_name }}',
              'run_id': '${{ github.run_id }}',
              'completed_at': datetime.now(timezone.utc).isoformat()
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit and push generated data safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/prompts.json data/update-log.json data/inbox/github-prompts.json data/inbox/lexica-prompts.json data/inbox/civitai-prompts.json data/inbox/official-github-prompts.json data/inbox/official-model-prompts.json

          if git diff --cached --quiet; then
            echo 'No generated data changes.'
            exit 0
          fi

          git commit -m 'تحديث تلقائي للمكتبة من الموصلات المفعلة'

          # Rebase before the first push, then retry safely if another update
          # reaches main between fetch and push. Never force-push main.
          for attempt in 1 2 3 4 5; do
            echo "Synchronizing with origin/main (attempt $attempt)..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo 'Rebase conflict detected. Aborting instead of risking main.'
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo 'Generated data pushed successfully.'
              exit 0
            fi

            echo "Push was rejected because main changed. Retrying..."
            sleep $((attempt * 5))
          done

          echo 'Unable to push after 5 safe attempts.'
          exit 1
