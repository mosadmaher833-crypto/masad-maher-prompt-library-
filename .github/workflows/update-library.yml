name: Update Prompt Library

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 15 * * *'

permissions:
  contents: write

concurrency:
  group: prompt-library-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate library
        run: python scripts/validate_library.py

      - name: Discover GitHub prompts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_prompt_connector.py

      - name: Discover declared GitHub prompt sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_prompt_sources_connector.py

      - name: Discover Lexica prompts
        run: python scripts/lexica_prompt_connector.py

      - name: Discover Civitai prompts
        run: python scripts/civitai_prompt_connector.py

      - name: Discover official GitHub prompts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/official_github_prompt_connector.py

      - name: Discover official model prompts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/official_model_prompt_connector.py

      - name: Discover visual prompts for review
        run: python scripts/visual_prompt_discovery.py

      - name: Import approved enabled-source inbox candidates
        run: python scripts/update-library.py

      - name: Translate prompts
        run: python scripts/translate-prompts.py

      - name: Enrich and classify
        run: python scripts/enrich-library.py

      - name: Build search index
        run: python scripts/build-search-index.py

      - name: Update Arabic UI
        run: python scripts/add-arabic-ui.py

      - name: Final validation
        run: python scripts/validate_library.py

      - name: Commit all generated library data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git add library-pro.html smart-search.html prompt-details.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'تحديث مكتبة البرومبتات تلقائيا'
          git push origin HEAD:main
