name: Update Prompt Library

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run safe updater
        run: python scripts/update-library.py

      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prompts.json data/update-log.json
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'تحديث تلقائي لبيانات مكتبة البرومبتات'
            git push
          fi
