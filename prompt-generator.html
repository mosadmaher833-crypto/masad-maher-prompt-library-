<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مولد البرومبت | مكتبة مسعد ماهر</title><style>body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}header{background:#111827;color:#fff;text-align:center;padding:25px}main{max-width:1000px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.box{background:#fff;padding:16px;border-radius:14px;border:1px solid #e5e7eb}label{display:block;font-weight:bold;margin-bottom:7px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;box-sizing:border-box}textarea{min-height:230px;margin-top:15px}.btn{margin-top:15px;padding:12px 18px;border:0;border-radius:9px;background:#111827;color:#fff;cursor:pointer}.out{margin-top:20px}</style></head><body><header><h1>🧠 مولد البرومبت الاحترافي</h1><p>ابنِ البرومبت خطوة بخطوة وفق نظام مكتبة مسعد ماهر</p></header><main><div class="grid" id="fields"></div><button class="btn" onclick="generate()">إنشاء البرومبت</button><button class="btn" onclick="copyOut()">نسخ الناتج</button><div class="out"><label>البرومبت النهائي</label><textarea id="out" readonly></textarea></div></main><script>const fields=[['الموضوع','الموضوع'],['الوضعية / الحركة','الوضعية أو الحركة'],['البيئة','البيئة'],['التكوين','التكوين'],['الكاميرا','الكاميرا / حركة الكاميرا'],['الإضاءة','الإضاءة'],['الأسلوب','الأسلوب'],['التفاصيل','التفاصيل'],['القيود','القيود'],['الناتج','الناتج']];document.getElementById('fields').innerHTML=fields.map((f,i)=>`<div class="box"><label>${i+1}. ${f[0]}</label><input id="f${i}" placeholder="اكتب ${f[0]}"></div>`).join('');function generate(){document.getElementById('out').value=fields.map((f,i)=>`${f[1]}: ${document.getElementById('f'+i).value||'غير محدد'}`).join('\n')}function copyOut(){navigator.clipboard.writeText(document.getElementById('out').value).then(()=>alert('تم النسخ ✅'))}</script></body></html>
