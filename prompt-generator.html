<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مولد البرومبت الاحترافي | مكتبة مسعد ماهر</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}header{background:#111827;color:#fff;text-align:center;padding:24px 16px}header h1{margin:0 0 8px}main{max-width:1100px;margin:auto;padding:20px}.toolbar{background:#fff;padding:16px;border:1px solid #e5e7eb;border-radius:14px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.box{background:#fff;padding:15px;border-radius:14px;border:1px solid #e5e7eb;box-shadow:0 2px 8px #00000008}label{display:block;font-weight:bold;margin-bottom:7px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;box-sizing:border-box;font:inherit;background:#fff}textarea{min-height:240px;margin-top:15px;line-height:1.8}.btn{margin:14px 6px 0 0;padding:12px 18px;border:0;border-radius:9px;background:#111827;color:#fff;cursor:pointer}.btn.secondary{background:#475569}.btn.green{background:#166534}.hidden{display:none}.hint{font-size:12px;color:#64748b;margin-top:6px}.back{display:inline-block;color:#fff;text-decoration:none;margin-top:8px}.out{margin-top:20px}</style></head><body><header><h1>🧠 مولد البرومبت الاحترافي</h1><p>اختر العناصر والمولد يركّب لك البرومبت تلقائيًا</p><a class="back" href="index.html">← العودة إلى المكتبة</a></header><main><div class="toolbar"><label>نوع البرومبت</label><select id="mode" onchange="render()"><option value="image">🖼️ برومبت صورة</option><option value="video">🎬 برومبت فيديو</option></select><div class="hint">يمكنك اختيار «مخصص» في أي خانة وكتابة القيمة التي تريدها.</div></div><div class="grid" id="fields"></div><button class="btn" onclick="generate()">⚡ إنشاء البرومبت</button><button class="btn green" onclick="copyOut()">📋 نسخ البرومبت</button><button class="btn secondary" onclick="resetAll()">↺ إعادة ضبط</button><div class="out"><label>البرومبت النهائي</label><textarea id="out" readonly placeholder="سيظهر البرومبت هنا..."></textarea></div></main><script>const imageFields=[['الموضوع','الموضوع',['بورتريه لشخص','منتج إعلاني','شخصية سينمائية','سيارة فاخرة','طعام فاخر','منظر طبيعي','مبنى معماري','مخصص']],['الوضعية','الوضعية',['أمامية','جانبية','زاوية 3/4','واقف','جالس','حركة ديناميكية','لقطة قريبة للوجه','مخصص']],['البيئة','البيئة',['استوديو احترافي','شارع حضري','مدينة ليلية','طبيعة','شاطئ','صحراء','مكتب فاخر','منزل فاخر','مخصص']],['التكوين','التكوين',['تمركز في المنتصف','قاعدة الأثلاث','تكوين متماثل','لقطة قريبة Close-up','لقطة واسعة Wide Shot','زاوية منخفضة','زاوية علوية','مخصص']],['الكاميرا','الكاميرا',['24mm Wide Angle','35mm Cinematic','50mm Standard','85mm Portrait','100mm Macro','Telephoto','Depth of Field ضحل','مخصص']],['الإضاءة','الإضاءة',['Softbox ناعمة','إضاءة ثلاثية النقاط','Golden Hour','Rim Light','Chiaroscuro درامية','Neon Cinematic','Volumetric Light','مخصص']],['الأسلوب','الأسلوب',['واقعي فوتوغرافي','سينمائي','إعلان فاخر','Editorial Fashion','3D عالي الجودة','Anime','سريالي','Concept Art','مخصص']],['التفاصيل','التفاصيل',['ملمس جلد واقعي','تفاصيل الأقمشة','انعكاسات واقعية','ظلال دقيقة','ضباب جوي','تفاصيل فائقة','مواد وخامات دقيقة','مخصص']],['القيود','القيود',['بدون تشوهات','بدون أصابع زائدة','بدون نصوص','بدون علامة مائية','حافظ على ملامح الهوية','نِسب جسم طبيعية','مخصص']],['الناتج','الناتج',['4K عالي الدقة','8K فائق الدقة','1:1 مربع','4:5 رأسي','16:9 أفقي','9:16 رأسي','جاهز للطباعة','مخصص']]];const videoFields=[['الموضوع','الموضوع',['شخصية سينمائية','منتج إعلاني','سيارة','مشهد رياضي','طعام','منظر طبيعي','مشهد معماري','مخصص']],['الحركة','الحركة',['مشي طبيعي','جري سريع','التفاتة بطيئة','حركة يد طبيعية','دوران المنتج','حركة سينمائية بطيئة','Slow Motion','مخصص']],['البيئة','البيئة',['استوديو','شارع حضري','مدينة ليلية','طبيعة','شاطئ','صحراء','مكتب فاخر','مخصص']],['حركة الكاميرا','حركة الكاميرا',['Dolly In','Dolly Out','Tracking Shot','Orbit 360°','Pan','Tilt','Crane Shot','Handheld ناعم','مخصص']],['الحركة البيئية','الحركة البيئية',['رياح خفيفة','مطر','غبار','دخان متحرك','حركة القماش','حركة المرور','أوراق متطايرة','مخصص']],['التوقيت','التوقيت',['5 ثوانٍ','8 ثوانٍ','10 ثوانٍ','إيقاع سينمائي بطيء','إيقاع سريع وديناميكي','انتقال سلس','مخصص']],['الإضاءة','الإضاءة',['إضاءة ناعمة','Golden Hour','Rim Light','Neon','إضاءة درامية','Volumetric Light','مخصص']],['الأسلوب','الأسلوب',['واقعي سينمائي','إعلان فاخر','وثائقي','Action Cinematic','3D','سريالي','Editorial','مخصص']],['الصوت','الصوت',['بدون صوت','موسيقى سينمائية','مؤثرات بيئية','صوت خطوات','صوت حركة واقعي','تعليق صوتي','مخصص']],['القيود','القيود',['حركة طبيعية','ثبات ملامح الشخصية','بدون تشوهات','بدون عناصر إضافية','بدون نصوص أو علامة مائية','انتقالات سلسة','مخصص']]];function render(){const data=document.getElementById('mode').value==='image'?imageFields:videoFields;document.getElementById('fields').innerHTML=data.map((f,i)=>`<div class="box"><label>${i+1}. ${f[0]}</label><select id="f${i}" onchange="toggleCustom(${i})">${f[2].map((x,j)=>`<option value="${x}">${x}</option>`).join('')}</select><input class="custom hidden" id="c${i}" placeholder="اكتب القيمة المخصصة..."><div class="hint">${f[1]}</div></div>`).join('')}function toggleCustom(i){const s=document.getElementById('f'+i),c=document.getElementById('c'+i);c.classList.toggle('hidden',s.value!=='مخصص')}function generate(){const data=document.getElementById('mode').value==='image'?imageFields:videoFields;document.getElementById('out').value=data.map((f,i)=>{const s=document.getElementById('f'+i),c=document.getElementById('c'+i);return `${f[1]}: ${s.value==='مخصص'?(c.value||'غير محدد'):s.value}`}).join(' → ')}function copyOut(){const out=document.getElementById('out').value;if(!out)return; navigator.clipboard.writeText(out).then(()=>alert('تم نسخ البرومبت ✅'))}function resetAll(){render();document.getElementById('out').value=''}render();</script></body></html>
