<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مولد ومحرر البرومبت | مكتبة مسعد ماهر</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:25px 16px;text-align:center}header h1{margin:0 0 8px}.back{color:#fff;text-decoration:none}.wrap{max-width:1150px;margin:auto;padding:18px}.toolbar,.box,.result{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:16px;margin-bottom:14px}.toolbar{display:grid;gap:10px}label{font-weight:bold;display:block;margin-bottom:7px}select,input,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;background:#fff}textarea{min-height:180px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.hint{font-size:12px;color:#64748b;margin-top:6px}.choices{font-size:12px;color:#475569;margin-top:7px;line-height:1.7}.btn{padding:11px 16px;border:0;border-radius:9px;cursor:pointer;background:#111827;color:#fff;margin:5px 3px}.btn.secondary{background:#475569}.btn.green{background:#166534}.formula{background:#f8fafc;border:1px dashed #cbd5e1;padding:12px;border-radius:10px;line-height:1.8}.imagebox{display:none;margin-top:12px}.imagebox img{max-width:100%;max-height:420px;border-radius:12px;display:block;margin:auto}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.section-title{margin:8px 0 12px}</style></head><body><header><h1>🧠 مولد ومحرر البرومبت الاحترافي</h1><p>البرومبت + قاعدة البناء + الاختيارات بين القوسين + المعاينة</p><a class="back" href="index.html">← العودة إلى المكتبة</a></header><main class="wrap"><div class="toolbar"><label>نوع البرومبت</label><select id="mode" onchange="render()"><option value="image">🖼️ صورة</option><option value="video">🎬 فيديو</option><option value="text">✍️ كتابة/محتوى</option></select><div class="formula" id="formula"></div></div><div class="grid" id="fields"></div><div class="result"><h2 class="section-title">📝 البرومبت النهائي</h2><textarea id="out" placeholder="سيظهر البرومبت هنا..."></textarea><button class="btn" onclick="generate()">⚡ بناء البرومبت</button><button class="btn green" onclick="copyOut()">📋 نسخ</button><button class="btn secondary" onclick="showImage()">🖼️ معاينة الصورة</button><button class="btn secondary" onclick="resetAll()">↺ إعادة ضبط</button><div class="imagebox" id="imagebox"><p>ضع رابط صورة مرجعية/نتيجة في الخانة المخصصة لعرضها هنا.</p><img id="preview" alt="معاينة"></div></div></main><script>const sets={image:{formula:'الموضوع → الوضعية → البيئة → التكوين → الكاميرا → الإضاءة → الأسلوب → التفاصيل → القيود → الناتج',fields:[['الموضوع',['بورتريه لشخص','منتج إعلاني','سيارة فاخرة','طعام فاخر','منظر طبيعي','مبنى معماري','شخصية سينمائية','مخصص']],['الوضعية',['أمامية','جانبية','زاوية 3/4','واقف','جالس','حركة ديناميكية','لقطة قريبة للوجه','مخصص']],['البيئة',['استوديو','شارع حضري','مدينة ليلية','طبيعة','شاطئ','صحراء','مكتب فاخر','مخصص']],['التكوين',['تمركز في المنتصف','قاعدة الأثلاث','تكوين متماثل','Close-up','Wide Shot','زاوية منخفضة','زاوية علوية','مساحة سالبة للنص','مخصص']],['الكاميرا',['24mm Wide Angle','35mm Cinematic','50mm Standard','85mm Portrait','100mm Macro','Telephoto','Depth of Field ضحل','مخصص']],['الإضاءة',['Softbox ناعمة','ثلاثية النقاط','Golden Hour','Rim Light','Chiaroscuro درامية','Neon Cinematic','Volumetric Light','مخصص']],['الأسلوب',['واقعي فوتوغرافي','سينمائي','إعلان فاخر','Editorial Fashion','3D عالي الجودة','Anime','سريالي','Concept Art','مخصص']],['التفاصيل',['ملمس جلد واقعي','تفاصيل الأقمشة','انعكاسات واقعية','ظلال دقيقة','ضباب جوي','تفاصيل فائقة','خامات دقيقة','مخصص']],['القيود',['بدون تشوهات','بدون أصابع زائدة','بدون نصوص','بدون علامة مائية','حافظ على الهوية والملامح','نِسب طبيعية','مخصص']],['الناتج',['4K','8K','1:1','4:5','16:9','9:16','جاهز للطباعة','مخصص']]]},video:{formula:'الموضوع → الحركة → البيئة → حركة الكاميرا → الحركة البيئية → التوقيت → الإضاءة → الأسلوب → الصوت → القيود',fields:[['الموضوع',['شخصية سينمائية','منتج إعلاني','سيارة','مشهد رياضي','طعام','منظر طبيعي','مخصص']],['الحركة',['مشي طبيعي','جري سريع','التفاتة بطيئة','حركة يد طبيعية','دوران المنتج','Slow Motion','مخصص']],['البيئة',['استوديو','شارع حضري','مدينة ليلية','طبيعة','شاطئ','صحراء','مكتب فاخر','مخصص']],['حركة الكاميرا',['Dolly In','Dolly Out','Tracking Shot','Orbit 360°','Pan','Tilt','Crane Shot','Handheld ناعم','مخصص']],['الحركة البيئية',['رياح خفيفة','مطر','غبار','دخان متحرك','حركة القماش','حركة المرور','أوراق متطايرة','مخصص']],['التوقيت',['5 ثوانٍ','8 ثوانٍ','10 ثوانٍ','إيقاع بطيء','إيقاع سريع','انتقال سلس','مخصص']],['الإضاءة',['ناعمة','Golden Hour','Rim Light','Neon','درامية','Volumetric Light','مخصص']],['الأسلوب',['واقعي سينمائي','إعلان فاخر','وثائقي','Action Cinematic','3D','سريالي','Editorial','مخصص']],['الصوت',['بدون صوت','موسيقى سينمائية','مؤثرات بيئية','صوت خطوات','صوت حركة واقعي','تعليق صوتي','مخصص']],['القيود',['حركة طبيعية','ثبات الهوية','بدون تشوهات','بدون عناصر إضافية','بدون نصوص أو علامة مائية','انتقالات سلسة','مخصص']]]},text:{formula:'الدور → السياق → البيانات → الهدف → الجمهور → الأسلوب → التعليمات → الناتج → القيود',fields:[['الدور',['كاتب محتوى خبير','مسوق رقمي','خبير تعليم','محلل بيانات','مستشار أعمال','مخصص']],['السياق',['منشور فيسبوك','مقال','إعلان','درس','تقرير','رسالة رسمية','مخصص']],['البيانات',['بيانات المستخدم فقط','نص مرفق','جدول مرفق','مصادر موثوقة','مخصص']],['الهدف',['التثقيف','الإقناع','البيع','التلخيص','التحليل','حل مشكلة','مخصص']],['الجمهور',['عام','عملاء محتملون','طلاب','متخصصون','إدارة','مخصص']],['الأسلوب',['واضح','احترافي','مختصر','مقنع','تعليمي','ودود','مخصص']],['التعليمات',['ابدأ بخطاف قوي','استخدم عناوين ونقاط','قدم أمثلة','اسأل عند نقص البيانات','لا تخترع معلومات','مخصص']],['الناتج',['قائمة','جدول','خطوات','مقال','سكريبت','JSON','مخصص']],['القيود',['بدون حشو','بدون تكرار','بدون ادعاءات غير مؤكدة','لغة عربية سليمة','التزم بالطول المطلوب','مخصص']]]}};function current(){return sets[document.getElementById('mode').value]}function render(){const d=current();document.getElementById('formula').innerHTML='<b>قاعدة البناء:</b> '+d.formula;document.getElementById('fields').innerHTML=d.fields.map((f,i)=>`<div class="box"><label>${i+1}. ${f[0]}</label><select id="f${i}" onchange="custom(${i})">${f[1].map(x=>`<option>${x}</option>`).join('')}</select><input id="c${i}" style="display:none;margin-top:7px" placeholder="اكتب اختيارك هنا..."><div class="choices">الاختيارات المقترحة: ${f[1].filter(x=>x!=='مخصص').map(x=>`<span class="pill">(${x})</span>`).join(' ')}</div></div>`).join('');document.getElementById('imagebox').style.display='none'}function custom(i){const s=document.getElementById('f'+i),c=document.getElementById('c'+i);c.style.display=s.value==='مخصص'?'block':'none'}function val(i){const s=document.getElementById('f'+i),c=document.getElementById('c'+i);return s.value==='مخصص'?(c.value||'________'):s.value}function generate(){const d=current();const names=d.fields.map(x=>x[0]);document.getElementById('out').value=names.map((n,i)=>`${n}: (${val(i)})`).join('\n')+'\n\nتعليمات التنفيذ: طبّق جميع العناصر مع الحفاظ على الاتساق، لا تضف عناصر غير مطلوبة، والتزم بالقيود والناتج المحدد.'}function copyOut(){const x=document.getElementById('out').value;if(x)navigator.clipboard.writeText(x).then(()=>alert('تم نسخ البرومبت ✅'))}function showImage(){const url=prompt('أدخل رابط الصورة للمعاينة:');if(url){document.getElementById('preview').src=url;document.getElementById('imagebox').style.display='block'}}function resetAll(){render();document.getElementById('out').value=''}render();</script></body></html>
