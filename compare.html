<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقارنة البرومبتات — مكتبة مسعد ماهر</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}.hero{background:linear-gradient(135deg,#111827,#4338ca);color:#fff;padding:30px;text-align:center}.wrap{max-width:1150px;margin:auto;padding:18px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.nav a,.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:12px;text-decoration:none;color:#172033}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{margin-bottom:14px}.box{background:#f8fafc;border-radius:11px;padding:12px;white-space:pre-wrap;line-height:1.8;min-height:180px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#4f46e5;color:#fff;cursor:pointer;margin:3px}.muted{color:#64748b}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="hero"><h1>⚖️ مقارنة البرومبتات</h1><p>اختر برومبتين من المكتبة واعرف الفروق في الجودة والمجال والأداة والمحتوى.</p></header><main class="wrap"><nav class="nav"><a href="library-final.html">🏠 الرئيسية</a><a href="library-pro.html">📚 المكتبة</a><a href="prompt-engineer.html">🤖 المهندس</a><a href="prompt-rater.html">🏆 المقيّم</a></nav><section class="card"><div class="grid"><div><label>البرومبت الأول</label><select id="a"></select></div><div><label>البرومبت الثاني</label><select id="b"></select></div></div><button class="btn" onclick="compare()">⚡ قارن الآن</button></section><section id="out" class="grid"></section></main><script>let P=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let x=await fetch('data/prompts.json?'+Date.now()).then(r=>r.json());P=x.prompts||x;let o=P.map((p,i)=>'<option value="'+i+'">'+esc(p.title||p.id)+'</option>').join('');document.getElementById('a').innerHTML=o;document.getElementById('b').innerHTML=o;if(P.length>1)document.getElementById('b').value='1'}function compare(){let a=P[+document.getElementById('a').value],b=P[+document.getElementById('b').value];if(!a||!b)return;let fields=[['المجال',a.category,b.category],['التصنيف',(a.subcategories||[]).join('، '),(b.subcategories||[]).join('، ')],['الأداة',a.tool||a.target_tool||'غير محددة',b.tool||b.target_tool||'غير محددة'],['الجودة',String(a.quality_score||'—')+'/10',String(b.quality_score||'—')+'/10'],['الوسوم',(a.tags||[]).join('، '),(b.tags||[]).join('، ')]];document.getElementById('out').innerHTML='<div class="card"><h2>'+esc(a.title)+'</h2><div class="box">'+esc(a.prompt)+'</div>'+fields.map(f=>'<p><b>'+f[0]+':</b> '+esc(f[1])+'</p>').join('')+'</div><div class="card"><h2>'+esc(b.title)+'</h2><div class="box">'+esc(b.prompt)+'</div>'+fields.map(f=>'<p><b>'+f[0]+':</b> '+esc(f[2])+'</p>').join('')+'</div>'}load();</script></body></html>
