<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | مكتبة مسعد ماهر</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}.head{background:linear-gradient(135deg,#111827,#312e81);color:#fff;padding:28px 16px}.wrap{max-width:1200px;margin:auto;padding:18px 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:14px}.stat b{font-size:28px;display:block;margin-top:6px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#111827;color:#fff;cursor:pointer;font-weight:700}.btn.alt{background:#e8edf5;color:#172033}.row{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin:10px 0}.row h3{margin:0 0 8px}.muted{color:#64748b}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.ok{background:#166534}.bad{background:#991b1b}textarea{width:100%;min-height:80px;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.hidden{display:none}.notice{padding:14px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;line-height:1.8}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="wrap"><h1>🛡️ لوحة إدارة مكتبة مسعد ماهر</h1><p>مراجعة مساهمات المجتمع ومراقبة المنصة.</p></div></header><main class="wrap"><div id="gate" class="card">جاري التحقق من الصلاحيات...</div><section id="app" class="hidden"><div class="grid"><div class="card stat">👥 المستخدمون<b id="users">0</b></div><div class="card stat">⏳ قيد المراجعة<b id="pending">0</b></div><div class="card stat">⭐ التقييمات<b id="ratings">0</b></div><div class="card stat">💬 التعليقات<b id="comments">0</b></div></div><div class="tabs"><button class="btn" onclick="loadSubmissions('pending')">المراجعة</button><button class="btn alt" onclick="loadSubmissions('approved')">المعتمدة</button><button class="btn alt" onclick="loadSubmissions('rejected')">المرفوضة</button><a class="btn alt" href="library-final.html">المكتبة</a><a class="btn alt" href="profile.html">الملف الشخصي</a></div><section class="card"><h2>📥 مساهمات البرومبتات</h2><div id="list">جاري التحميل...</div></section></section></main><script type="module">import{supabase,getCurrentUser}from'./supabase-client.js';const $=id=>document.getElementById(id);let current='pending';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const u=await getCurrentUser();if(!u){$('gate').innerHTML='يجب تسجيل الدخول أولًا. <a href="auth.html">تسجيل الدخول</a>';return}const{data:p,error}=await supabase.from('profiles').select('role').eq('id',u.id).single();if(error||p?.role!=='admin'){$('gate').innerHTML='<div class="notice"><b>هذه الصفحة للمشرف فقط.</b><br>إذا كان هذا حساب مالك المنصة، سجّل الدخول ثم قم بتعيين دور admin لحسابك من قاعدة Supabase مرة واحدة. بعد ذلك ستعمل اللوحة تلقائيًا.</div>';return}$('gate').classList.add('hidden');$('app').classList.remove('hidden');await stats();await loadSubmissions('pending')}async function stats(){const qs=async t=>{const r=await supabase.from(t).select('*',{count:'exact',head:true});return r.count||0};$('users').textContent=await qs('profiles');$('ratings').textContent=await qs('prompt_ratings');$('comments').textContent=await qs('prompt_comments');$('pending').textContent=await qs('prompt_submissions').then(()=>0);const r=await supabase.from('prompt_submissions').select('*',{count:'exact',head:true}).eq('status','pending');$('pending').textContent=r.count||0}window.loadSubmissions=async status=>{current=status;$('list').innerHTML='جاري التحميل...';const{data,error}=await supabase.from('prompt_submissions').select('*').eq('status',status).order('created_at',{ascending:false}).limit(100);if(error){$('list').textContent=error.message;return}if(!data?.length){$('list').innerHTML='<p class="muted">لا توجد مساهمات في هذه الحالة.</p>';return}$('list').innerHTML=data.map(s=>`<article class="row"><h3>${esc(s.title||'بدون عنوان')}</h3><div class="muted">${esc(s.category||'')} · ${esc(s.model||'')} · ${new Date(s.created_at).toLocaleString('ar-EG')}</div><p><b>المصدر:</b> ${s.source_url?`<a href="${esc(s.source_url)}" target="_blank" rel="noopener">فتح المصدر</a>`:'غير موجود'}</p><details><summary>عرض البرومبت</summary><pre style="white-space:pre-wrap;line-height:1.8">${esc(s.prompt)}</pre></details><div><label>ملاحظة المراجع</label><textarea id="note-${s.id}" placeholder="سبب الاعتماد أو الرفض...">${esc(s.reviewer_notes||'')}</textarea></div><div class="actions">${status==='pending'?`<button class="btn ok" onclick="moderate('${s.id}','approved')">✅ اعتماد</button><button class="btn bad" onclick="moderate('${s.id}','rejected')">❌ رفض</button>`:''}<button class="btn alt" onclick="copyPrompt('${s.id}')">نسخ</button></div></article>`).join('')}window.copyPrompt=async id=>{const{data}=await supabase.from('prompt_submissions').select('prompt').eq('id',id).single();if(data)await navigator.clipboard.writeText(data.prompt);};window.moderate=async(id,status)=>{const note=document.getElementById('note-'+id)?.value||'';const{error}=await supabase.from('prompt_submissions').update({status,reviewer_notes:note,reviewed_at:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);return}await stats();await loadSubmissions(current)};boot();</script></body></html>
