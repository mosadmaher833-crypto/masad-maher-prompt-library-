<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة مسعد ماهر للـPrompts</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:28px 18px;text-align:center}header h1{margin:0 0 8px;font-size:30px}header p{margin:0;color:#cbd5e1}.wrap{max-width:1150px;margin:auto;padding:22px}.top{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:14px}.search{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}.generator,.tool{display:block;background:#fff;border:1px solid #cbd5e1;border-radius:14px;padding:14px;text-decoration:none;color:#172033}.generator b,.tool b{display:block;margin-bottom:5px}.generator span,.tool span{color:#64748b;font-size:13px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.filters button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.filters button.active{background:#111827;color:#fff}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.count{color:#64748b;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 4px 14px #00000008}.tag{display:inline-block;background:#eef2ff;border-radius:8px;padding:5px 8px;font-size:12px}.card h3{margin:10px 0}.card p{line-height:1.6;color:#64748b;font-size:13px}.prompt{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.7;font-size:14px;max-height:180px;overflow:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:0;border-radius:9px;padding:10px;cursor:pointer;background:#111827;color:#fff}.btn.secondary{background:#e2e8f0;color:#172033}.fav{float:left;background:none;border:0;font-size:22px;cursor:pointer}.empty{text-align:center;padding:50px;color:#64748b}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.modalbox{background:#fff;border-radius:18px;max-width:850px;width:100%;max-height:90vh;overflow:auto;padding:22px}.close{float:left;border:0;background:#e2e8f0;border-radius:8px;padding:8px 12px;cursor:pointer}</style></head><body><header><h1>📚 مكتبة مسعد ماهر للـPrompts</h1><p>ابحث، اكتشف، احفظ، انسخ وطوّر البرومبتات في مكان واحد.</p></header><main class="wrap"><div class="top"><input class="search" id="search" placeholder="🔎 ابحث بالعنوان أو المجال أو الوسوم أو محتوى البرومبت..." oninput="render()"><a class="generator" href="prompt-generator.html"><b>🧠 مولّد البرومبت</b><span>صورة + فيديو</span></a></div><div class="stats"><div class="stat">📦 إجمالي البرومبتات: <b id="total"></b></div><div class="stat">⭐ المفضلة: <b id="favCount"></b></div><div class="stat">🏷️ الوسوم: <b>بحث مباشر</b></div></div><div class="filters" id="filters"></div><div class="bar"><span class="count" id="count"></span><button class="btn secondary" onclick="showFavorites()">⭐ عرض المفضلة</button></div><section class="grid" id="grid"></section></main><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><button class="close" onclick="closeModal()">إغلاق ✕</button><div id="modalContent"></div></div></div><script>const prompts=[{id:1,title:'صورة إعلانية سينمائية لمنتج',cat:'صور',tags:['إعلان','سينمائي','منتج'],text:'الموضوع: [المنتج]\nالوضعية: موضوع رئيسي واضح في المنتصف\nالبيئة: بيئة مناسبة للمنتج\nالتكوين: تكوين إعلاني متوازن\nالكاميرا: لقطة احترافية بعمق مجال ضحل\nالإضاءة: إضاءة سينمائية ناعمة\nالأسلوب: واقعي فاخر\nالتفاصيل: خامات دقيقة وتفاصيل عالية\nالقيود: بدون نصوص عشوائية أو تشوهات\nالناتج: صورة إعلانية عالية الجودة'},{id:2,title:'فيديو سينمائي احترافي',cat:'فيديو',tags:['فيديو','سينمائي','كاميرا'],text:'الموضوع: [الشخص/المنتج]\nالحركة: حركة طبيعية وواضحة\nالبيئة: مشهد سينمائي غني بالتفاصيل\nحركة الكاميرا: Dolly in بطيء وسلس\nالحركة البيئية: حركة خفيفة للعناصر المحيطة\nالتوقيت: إيقاع سينمائي متدرج\nالإضاءة: إضاءة درامية واقعية\nالأسلوب: Cinematic photorealistic\nالصوت: مؤثرات بيئية مناسبة\nالقيود: بدون اهتزاز أو تشوه أو تغيّر في الهوية'},{id:3,title:'كتابة محتوى احترافي',cat:'كتابة',tags:['محتوى','كتابة','سوشيال'],text:'التعليمات: تصرف ككاتب محتوى محترف\nالسياق: [الموضوع]\nالجمهور: [الجمهور المستهدف]\nالهدف: تقديم قيمة واضحة وقابلة للتطبيق\nالأسلوب: عربي واضح ومقنع\nالناتج: عنوان جذاب + مقدمة + نقاط رئيسية + خاتمة + دعوة لاتخاذ إجراء\nالقيود: تجنب الحشو والمعلومات غير المؤكدة'},{id:4,title:'تحليل بيانات واتخاذ قرار',cat:'بيانات',tags:['تحليل','بيانات','قرار'],text:'الدور: محلل بيانات خبير\nالبيانات: [ألصق البيانات هنا]\nالهدف: اكتشاف الاتجاهات والمشكلات والفرص\nالتحليل: نظف البيانات ثم حللها ثم استخرج أهم النتائج\nالناتج: ملخص تنفيذي + مؤشرات رئيسية + استنتاجات + توصيات عملية\nالقيود: لا تفترض بيانات غير موجودة واذكر أي نقص بوضوح'}];const cats=['الكل','صور','فيديو','كتابة','بيانات','⭐ المفضلة'];let active='الكل';let favorites=JSON.parse(localStorage.getItem('mm_favorites')||'[]');function setCat(c){active=c;render()}function showFavorites(){active='⭐ المفضلة';render()}function isFav(id){return favorites.includes(id)}function toggleFav(id){favorites=isFav(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('mm_favorites',JSON.stringify(favorites));render()}function copyPrompt(id){navigator.clipboard.writeText(prompts.find(p=>p.id===id).text).then(()=>alert('تم نسخ البرومبت ✅'))}function details(id){const p=prompts.find(x=>x.id===id);document.getElementById('modalContent').innerHTML=`<h2>${p.title}</h2><p>المجال: ${p.cat}</p><p>الوسوم: ${p.tags.map(t=>'#'+t).join(' ')}</p><div class="prompt">${p.text}</div><button class="btn" style="margin-top:12px" onclick="copyPrompt(${p.id})">📋 نسخ البرومبت</button>`;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function render(){document.getElementById('filters').innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');const q=document.getElementById('search').value.toLowerCase().trim();let list=prompts.filter(p=>(active==='الكل'||active===p.cat||(active==='⭐ المفضلة'&&isFav(p.id)))&&(`${p.title} ${p.cat} ${p.tags.join(' ')} ${p.text}`).toLowerCase().includes(q));document.getElementById('total').textContent=prompts.length;document.getElementById('favCount').textContent=favorites.length;document.getElementById('count').textContent=`عدد النتائج: ${list.length}`;document.getElementById('grid').innerHTML=list.length?list.map(p=>`<article class="card"><button class="fav" onclick="toggleFav(${p.id})">${isFav(p.id)?'⭐':'☆'}</button><span class="tag">${p.cat}</span><h3>${p.title}</h3><p>${p.tags.map(t=>'#'+t).join(' ')}</p><div class="prompt">${p.text}</div><div class="actions"><button class="btn" onclick="copyPrompt(${p.id})">📋 نسخ</button><button class="btn secondary" onclick="details(${p.id})">👁️ التفاصيل</button></div></article>`).join(''):'<div class="empty">لا توجد نتائج مطابقة.</div>'}render();</script></body></html>
