<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة مسعد ماهر للـPrompts</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:28px 18px;text-align:center}header h1{margin:0 0 8px}.wrap{max-width:1200px;margin:auto;padding:20px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.nav a{background:#fff;border:1px solid #dbe1ea;border-radius:14px;padding:13px;text-decoration:none;color:#172033;text-align:center}.nav b{display:block}.nav span{color:#64748b;font-size:13px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px;margin-bottom:16px}.search{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.filters select,.sort{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.btn{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;background:#111827;color:#fff}.btn.secondary{background:#e2e8f0;color:#172033}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 4px 14px #00000008}.tag{display:inline-block;background:#eef2ff;border-radius:8px;padding:5px 8px;font-size:12px}.quality{float:left;background:#ecfdf5;border:1px solid #bbf7d0;border-radius:8px;padding:4px 7px;font-size:12px}.card h3{margin:10px 0}.card p{line-height:1.6;color:#64748b;font-size:13px}.prompt{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.7;font-size:14px;max-height:190px;overflow:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.fav{float:left;background:none;border:0;font-size:22px;cursor:pointer}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.modalbox{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:90vh;overflow:auto;padding:22px}.close{float:left;border:0;background:#e2e8f0;border-radius:8px;padding:8px 12px;cursor:pointer}.status,.empty{text-align:center;padding:50px;color:#64748b}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.meta span{background:#f1f5f9;border-radius:8px;padding:5px 8px;font-size:12px}.formula{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px;line-height:1.8}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.nav{grid-template-columns:1fr}}@media(max-width:500px){.filters{grid-template-columns:1fr}}</style></head><body><header><h1>📚 مكتبة مسعد ماهر للـPrompts</h1><p>البرومبت + قاعدة البناء + التعديل الذكي بالاختيارات</p></header><main class="wrap"><nav class="nav"><a href="index.html"><b>📚 المكتبة</b><span>كل البرومبتات</span></a><a href="sources.html"><b>🌐 المصادر</b><span>المصادر المعتمدة</span></a><a href="prompt-generator.html"><b>🧠 المولد</b><span>إنشاء برومبت</span></a></nav><section class="panel"><input class="search" id="search" placeholder="🔎 ابحث في البرومبتات..." oninput="render()"><div class="filters"><select id="cat" onchange="render()"><option value="">كل المجالات</option></select><select id="sub" onchange="render()"><option value="">كل التصنيفات</option></select><select id="source" onchange="render()"><option value="">كل المصادر</option></select><select id="tool" onchange="render()"><option value="">كل الأدوات</option></select><select id="quality" onchange="render()"><option value="">كل الجودة</option><option value="9">9 فأعلى</option><option value="8">8 فأعلى</option><option value="7">7 فأعلى</option></select></div><div class="bar"><select id="sort" class="sort" onchange="render()" style="max-width:220px"><option value="new">الأحدث</option><option value="quality">الأعلى جودة</option><option value="title">أبجديًا</option></select><div><button class="btn secondary" onclick="activeFav=true;render()">⭐ المفضلة</button> <button class="btn secondary" onclick="activeFav=false;render()">كل البرومبتات</button></div></div></section><div class="stats"><div class="stat">📦 إجمالي: <b id="total">...</b></div><div class="stat">⭐ المفضلة: <b id="favCount">0</b></div><div class="stat">🎯 النتائج: <b id="resultCount">...</b></div></div><section class="grid" id="grid"><div class="status">جاري التحميل...</div></section></main><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><button class="close" onclick="closeModal()">إغلاق ✕</button><div id="modalContent"></div></div></div><script>let prompts=[],favorites=JSON.parse(localStorage.getItem('mm_favorites')||'[]'),activeFav=false;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));const vals=k=>[...new Set(prompts.flatMap(p=>Array.isArray(p[k])?p[k]:[p[k]]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'ar'));function fill(id,values,label){document.getElementById(id).innerHTML='<option value="">'+label+'</option>'+values.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}function isFav(id){return favorites.includes(id)}function toggleFav(id){favorites=isFav(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('mm_favorites',JSON.stringify(favorites));render()}function copyText(t){navigator.clipboard.writeText(t).then(()=>alert('تم النسخ ✅'))}function copyPrompt(id){let p=prompts.find(x=>x.id===id);if(p)copyText(p.prompt||'')}function details(id){let p=prompts.find(x=>x.id===id);if(!p)return;document.getElementById('modalContent').innerHTML='<h2>'+esc(p.title)+'</h2><div class="meta"><span>المجال: '+esc(p.category)+'</span><span>المصدر: '+esc(p.source||'مكتبة مسعد ماهر')+'</span><span>الجودة: '+esc(p.quality_score||'—')+'/10</span></div><p>الوسوم: '+(p.tags||[]).map(x=>'#'+esc(x)).join(' ')+'</p><h3>🧩 قاعدة بناء البرومبت</h3><div class="formula">'+esc(p.template||'غير محددة')+'</div><h3>📝 البرومبت</h3><div class="prompt">'+esc(p.prompt)+'</div><div class="actions"><button class="btn" onclick="copyPrompt(\''+String(p.id).replace(/'/g,"\\'")+'\')">📋 نسخ</button><button class="btn secondary" onclick="location.href=\'prompt-editor.html?id='+encodeURIComponent(p.id)+'\'">🛠️ تعديل بالاختيارات</button></div>'+(p.source_url?'<p>🔗 <a href="'+esc(p.source_url)+'" target="_blank" rel="noopener">المصدر</a></p>':'');document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function render(){let q=document.getElementById('search').value.toLowerCase().trim(),cat=document.getElementById('cat').value,sub=document.getElementById('sub').value,source=document.getElementById('source').value,tool=document.getElementById('tool').value,minq=Number(document.getElementById('quality').value||0),sort=document.getElementById('sort').value;let list=prompts.filter(p=>{let hay=JSON.stringify(p).toLowerCase(),tools=[p.tool,p.tools].flat().filter(Boolean);return(!activeFav||isFav(p.id))&&(!q||hay.includes(q))&&(!cat||p.category===cat)&&(!sub||(p.subcategories||[]).includes(sub))&&(!source||p.source===source)&&(!tool||tools.includes(tool))&&(!minq||Number(p.quality_score||0)>=minq)});if(sort==='quality')list.sort((a,b)=>Number(b.quality_score||0)-Number(a.quality_score||0));if(sort==='title')list.sort((a,b)=>String(a.title).localeCompare(String(b.title),'ar'));document.getElementById('total').textContent=prompts.length;document.getElementById('favCount').textContent=favorites.length;document.getElementById('resultCount').textContent=list.length;document.getElementById('grid').innerHTML=list.length?list.map(p=>'<article class="card"><button class="fav" onclick="toggleFav(\''+String(p.id).replace(/'/g,"\\'")+'\')">'+(isFav(p.id)?'⭐':'☆')+'</button>'+(p.quality_score?'<span class="quality">⭐ '+esc(p.quality_score)+'/10</span>':'')+'<span class="tag">'+esc(p.category)+'</span><h3>'+esc(p.title)+'</h3><p>'+((p.tags||[]).map(t=>'#'+esc(t)).join(' '))+'</p><div class="prompt">'+esc(p.prompt)+'</div><div class="actions"><button class="btn" onclick="copyPrompt(\''+String(p.id).replace(/'/g,"\\'")+'\')">📋 نسخ</button><button class="btn secondary" onclick="details(\''+String(p.id).replace(/'/g,"\\'")+'\')">👁️ التفاصيل</button></div></article>').join(''):'<div class="empty">لا توجد نتائج.</div>'}async function load(){try{let r=await fetch('data/prompts.json',{cache:'no-store'});let d=await r.json();prompts=Array.isArray(d)?d:d.prompts||[];fill('cat',vals('category'),'كل المجالات');fill('sub',vals('subcategories'),'كل التصنيفات');fill('source',vals('source'),'كل المصادر');fill('tool',vals('tool'),'كل الأدوات');render()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">تعذر تحميل قاعدة البرومبتات.</div>'}}load()</script></body></html>
