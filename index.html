<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة مسعد ماهر للـPrompts</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:30px 18px;text-align:center}header h1{margin:0 0 8px;font-size:30px}header p{margin:0;color:#cbd5e1}.wrap{max-width:1100px;margin:auto;padding:22px}.search{display:flex;gap:10px;margin-bottom:16px}.search input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.filters button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:9px 15px;cursor:pointer}.filters button.active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 4px 14px #00000008}.tag{display:inline-block;background:#eef2ff;border-radius:8px;padding:5px 8px;font-size:12px}.card h3{margin:10px 0}.card p{line-height:1.7;color:#475569}.prompt{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.7;font-size:14px}.copy{width:100%;margin-top:12px;background:#111827;color:#fff;border:0;border-radius:9px;padding:11px;cursor:pointer}.count{color:#64748b;font-size:14px}.empty{text-align:center;padding:50px;color:#64748b}.generator{display:block;margin:0 0 22px;background:#fff;border:2px solid #cbd5e1;border-radius:16px;padding:18px;text-decoration:none;color:#172033}.generator b{display:block;margin-bottom:7px}.generator span{color:#64748b}</style></head><body><header><h1>📚 مكتبة مسعد ماهر للـPrompts</h1><p>ابحث، اكتشف، انسخ وطوّر البرومبتات في مكان واحد.</p></header><main class="wrap"><a class="generator" href="prompt-generator.html"><b>🧠 افتح مولّد البرومبت الاحترافي</b><span>أنشئ برومبت خطوة بخطوة وفق النظام الموحد للمكتبة.</span></a><div class="search"><input id="search" placeholder="🔎 ابحث عن برومبت أو كلمة..." oninput="render()"></div><div class="filters" id="filters"></div><p class="count" id="count"></p><section class="grid" id="grid"></section></main><script>const prompts=[{id:1,title:'صورة إعلانية سينمائية لمنتج',cat:'صور',tags:'إعلان سينمائي',text:'الموضوع: [المنتج]\nالوضعية: موضوع رئيسي واضح في المنتصف\nالبيئة: بيئة مناسبة للمنتج\nالتكوين: تكوين إعلاني متوازن\nالكاميرا: لقطة احترافية بعمق مجال ضحل\nالإضاءة: إضاءة سينمائية ناعمة\nالأسلوب: واقعي فاخر\nالتفاصيل: خامات دقيقة وتفاصيل عالية\nالقيود: بدون نصوص عشوائية أو تشوهات\nالناتج: صورة إعلانية عالية الجودة'},{id:2,title:'فيديو سينمائي احترافي',cat:'فيديو',tags:'فيديو سينمائي',text:'الموضوع: [الشخص/المنتج]\nالحركة: حركة طبيعية وواضحة\nالبيئة: مشهد سينمائي غني بالتفاصيل\nحركة الكاميرا: Dolly in بطيء وسلس\nالحركة البيئية: حركة خفيفة للعناصر المحيطة\nالتوقيت: إيقاع سينمائي متدرج\nالإضاءة: إضاءة درامية واقعية\nالأسلوب: Cinematic photorealistic\nالصوت: مؤثرات بيئية مناسبة\nالقيود: بدون اهتزاز أو تشوه أو تغيّر في الهوية'},{id:3,title:'كتابة محتوى احترافي',cat:'كتابة',tags:'محتوى كتابة',text:'التعليمات: تصرف ككاتب محتوى محترف\nالسياق: [الموضوع]\nالجمهور: [الجمهور المستهدف]\nالهدف: تقديم قيمة واضحة وقابلة للتطبيق\nالأسلوب: عربي واضح ومقنع\nالناتج: عنوان جذاب + مقدمة + نقاط رئيسية + خاتمة + دعوة لاتخاذ إجراء\nالقيود: تجنب الحشو والمعلومات غير المؤكدة'},{id:4,title:'تحليل بيانات واتخاذ قرار',cat:'بيانات',tags:'تحليل بيانات',text:'الدور: محلل بيانات خبير\nالبيانات: [ألصق البيانات هنا]\nالهدف: اكتشاف الاتجاهات والمشكلات والفرص\nالتحليل: نظف البيانات ثم حللها ثم استخرج أهم النتائج\nالناتج: ملخص تنفيذي + مؤشرات رئيسية + استنتاجات + توصيات عملية\nالقيود: لا تفترض بيانات غير موجودة واذكر أي نقص بوضوح'}];const cats=['الكل','صور','فيديو','كتابة','بيانات'];let active='الكل';function setCat(c){active=c;render()}function render(){document.getElementById('filters').innerHTML=cats.map(c=>`<button class="${c===active?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');const q=document.getElementById('search').value.toLowerCase();const list=prompts.filter(p=>(active==='الكل'||p.cat===active)&&(`${p.title} ${p.tags} ${p.text}`).toLowerCase().includes(q));document.getElementById('count').textContent=`عدد النتائج: ${list.length}`;document.getElementById('grid').innerHTML=list.length?list.map(p=>`<article class="card"><span class="tag">${p.cat}</span><h3>${p.title}</h3><p>#${p.tags.replaceAll(' ',' #')}</p><div class="prompt">${p.text}</div><button class="copy" onclick="copyPrompt(${p.id})">📋 نسخ البرومبت</button></article>`).join(''):'<div class="empty">لا توجد نتائج مطابقة.</div>'}function copyPrompt(id){navigator.clipboard.writeText(prompts.find(p=>p.id===id).text).then(()=>alert('تم نسخ البرومبت ✅'))}render();</script></body></html>
