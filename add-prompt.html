<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إضافة برومبت | مكتبة مسعد ماهر</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}.head{background:linear-gradient(135deg,#111827,#4338ca);color:#fff;padding:30px 16px;text-align:center}.wrap{max-width:1000px;margin:auto;padding:20px 14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.field textarea{min-height:150px;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#111827;color:#fff;text-decoration:none;cursor:pointer;font-weight:700}.btn.alt{background:#e8edf5;color:#172033}.notice{background:#ecfeff;border:1px solid #a5f3fc;border-radius:12px;padding:13px;line-height:1.8}.status{display:none;background:#ecfdf5;border:1px solid #a7f3d0;color:#166534;border-radius:12px;padding:13px;margin-top:14px;line-height:1.8}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="head"><h1>➕ إضافة برومبت إلى مكتبة مسعد ماهر</h1><p>أرسل البرومبت مباشرة إلى طابور المراجعة المركزي.</p></header><main class="wrap"><section class="card"><div class="notice">بعد الإرسال يصبح البرومبت <b>قيد المراجعة</b>. لن يظهر في المكتبة العامة إلا بعد فحص الجودة والمصدر والتكرار من الإدارة.</div></section><form id="form" class="card"><div class="grid"><div class="field"><label>العنوان *</label><input id="title" required placeholder="مثال: إعلان مشروب فاخر"></div><div class="field"><label>المجال *</label><input id="category" required placeholder="صور / فيديو / إعلان / كتابة..."></div><div class="field"><label>التصنيف الفرعي</label><input id="subcategory" placeholder="إعلان، منتجات"></div><div class="field"><label>الأداة المستهدفة</label><input id="model" placeholder="Midjourney / FLUX / Veo..."></div><div class="field"><label>اللغة</label><select id="language"><option>العربية</option><option>English</option><option>عربي + English</option></select></div><div class="field"><label>الجودة المقترحة</label><select id="quality"><option>10</option><option>9</option><option selected>8</option><option>7</option><option>6</option></select></div><div class="field full"><label>رابط المصدر</label><input id="source_url" type="url" placeholder="https://..."></div><div class="field full"><label>البرومبت الكامل *</label><textarea id="prompt" required placeholder="اكتب البرومبت هنا..."></textarea></div><div class="field full"><label>قاعدة البناء / Template</label><input id="template" placeholder="الموضوع → الوضعية → البيئة → التكوين..."></div><div class="field full"><label>الوسوم</label><input id="tags" placeholder="سينمائي، واقعي، إعلان"></div><div class="field full"><label>رابط صورة المعاينة</label><input id="image_url" type="url" placeholder="https://..."></div><div class="field full"><label>ملاحظات وتحسينات</label><textarea id="notes" placeholder="متى يستخدم؟ وما أهم ملاحظات الجودة؟"></textarea></div></div><div class="actions"><button class="btn" type="submit">📤 إرسال للمراجعة</button><button class="btn alt" type="button" onclick="resetForm()">↺ مسح</button><a class="btn alt" href="community.html">👥 مساهماتي</a><a class="btn alt" href="library-pro.html">📚 المكتبة</a></div><div id="status" class="status"></div></form></main><script type="module">import{supabase,getCurrentUser}from'./supabase-client.js';const $=id=>document.getElementById(id);const val=id=>$(id).value.trim();function resetForm(){$('form').reset();$('status').style.display='none'}$('form').addEventListener('submit',async e=>{e.preventDefault();const user=await getCurrentUser();if(!user){location.href='auth.html?redirect=add-prompt.html';return}const payload={user_id:user.id,title:val('title'),category:val('category'),subcategory:val('subcategory'),prompt:val('prompt'),source_url:val('source_url')||null,image_url:val('image_url')||null,model:val('model')||null,tags:val('tags').split(',').map(x=>x.trim()).filter(Boolean),notes:(val('notes')+'\nقاعدة البناء: '+val('template')).trim(),status:'pending'};const{error}=await supabase.from('prompt_submissions').insert(payload);if(error){$('status').style.display='block';$('status').textContent='تعذر إرسال البرومبت: '+error.message;return}let saved=[];try{saved=JSON.parse(localStorage.getItem('mm_my_prompts')||'[]')}catch(_){}saved.push({...payload,id:'user-'+Date.now().toString(36),quality_score:Number(val('quality')||8),language:val('language'),created_at:new Date().toISOString()});localStorage.setItem('mm_my_prompts',JSON.stringify(saved));$('status').style.display='block';$('status').innerHTML='تم إرسال البرومبت إلى طابور المراجعة المركزي بنجاح ✅<br><a href="community.html">متابعة حالة المساهمة ↗</a>';e.target.reset()});</script></body></html>
