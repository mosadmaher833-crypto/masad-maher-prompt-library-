<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="محرك البحث الذكي في مكتبة مسعد ماهر للبرومبتات: يفهم المجال والأداة والهدف ويصنف النتائج حسب الصلة والجودة."><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#312e81"><title>البحث الذكي — مكتبة مسعد ماهر</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}.hero{background:linear-gradient(135deg,#111827,#312e81,#4f46e5);color:#fff;padding:42px 18px;text-align:center}.hero h1{margin:0 0 10px;font-size:30px}.hero p{margin:0;opacity:.9}.wrap{max-width:1250px;margin:auto;padding:16px}.panel,.card,.intent{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 5px 20px #00000008}.search{width:100%;padding:17px;border:2px solid #c7d2fe;border-radius:14px;font-size:17px;outline:0}.examples{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.example{border:1px solid #dbe3ef;background:#f8fafc;border-radius:999px;padding:8px 11px;cursor:pointer}.intent{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.pill{background:#eef2ff;border-radius:999px;padding:7px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}.card h3{margin:8px 0}.meta{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#f1f5f9;padding:5px 8px;border-radius:8px;font-size:11px}.score{float:left;background:#ecfdf5;padding:5px 8px;border-radius:8px;font-size:11px}.prompt{margin-top:10px;background:#f8fafc;border:1px dashed #cbd5e1;padding:11px;border-radius:10px;line-height:1.7;font-size:13px;max-height:170px;overflow:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.btn{border:0;border-radius:9px;padding:10px;background:#172033;color:#fff;cursor:pointer;text-decoration:none;text-align:center}.btn.accent{background:#4f46e5}.btn.engineer{background:#7c3aed}.empty{text-align:center;padding:45px;color:#64748b}.why{font-size:12px;color:#475569;line-height:1.7}.nav{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px}.nav a{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px;text-align:center;text-decoration:none;color:#172033}.nav span{display:block;color:#64748b;font-size:10px;margin-top:3px}.engineerNav{background:#ede9fe!important;color:#5b21b6!important;font-weight:bold}@media(max-width:850px){.nav{grid-template-columns:repeat(4,1fr)}}@media(max-width:450px){.nav{grid-template-columns:1fr 1fr}.hero h1{font-size:24px}}</style></head><body><header class="hero"><h1>🧠 البحث الذكي في مكتبة مسعد ماهر</h1><p>اكتب ما تريد بطريقتك الطبيعية، وسأرتب لك البرومبتات حسب الصلة والأداة والمجال والجودة.</p></header><main class="wrap"><nav class="nav"><a href="index.html">📚<b>الرئيسية</b><span>المنصة</span></a><a href="library-pro.html">🚀<b>المكتبة</b><span>الكتالوج</span></a><a href="smart-search.html">🧠<b>البحث الذكي</b><span>اكتشاف</span></a><a class="engineerNav" href="prompt-engineer.html">🤖<b>مهندس البرومبت</b><span>هندسة</span></a><a href="prompt-generator.html">✍️<b>المولد</b><span>إنشاء</span></a><a href="prompt-editor.html">🛠️<b>المحرر</b><span>تحسين</span></a><a href="sources.html">🌐<b>المصادر</b><span>المراجع</span></a></nav><section class="panel"><input id="q" class="search" autofocus placeholder="مثال: برومبت إعلان مشروب غازي سينمائي لـ Nano Banana..."><div class="examples"><button class="example">إعلان منتج فاخر تصوير سينمائي</button><button class="example">بورتريه واقعي بإضاءة استوديو</button><button class="example">فيديو قصير حركة كاميرا سينمائية</button><button class="example">تصميم معماري واجهة حديثة</button></div></section><section id="intent" class="intent"><b>فهم الطلب:</b><span class="pill" id="intentText">اكتب طلبك للبدء</span></section><section id="grid" class="grid"><div class="empty">اكتب طلبًا وسأبحث في المكتبة.</div></section></main><script>let P=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u064B-\u065F]/g,'').replace(/أ|إ|آ/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');const dict={"اعلان":["اعلان","advertising","ad","product"],"إعلان":["اعلان","advertising","ad","product"],"منتج":["product","commercial","advertising"],"مشروب":["drink","beverage","soda","product"],"سينمائي":["cinematic","film","cinema"],"بورتريه":["portrait","face","photography"],"واقعي":["realistic","photorealistic","photo"],"فيديو":["video","motion","cinematic"],"معماري":["architecture","architectural","building"],"تصوير":["photography","camera","lens"],"فاخر":["luxury","premium","high-end"],"انمي":["anime","manga"],"ثري دي":["3d","render","3d render"],"طعام":["food","culinary","restaurant"],"تعليم":["education","teaching","lesson"],"برمجة":["programming","code","developer"],"بيانات":["data","analysis","analytics"],"انشاء":["generate","create","prompt"],"نانو بانانا":["nano banana","nanobanana","banana"],"midjourney":["midjourney"],"flux":["flux"],"runway":["runway"],"kling":["kling"],"sora":["sora"],"veo":["veo"]};function tokens(q){return norm(q).split(/[^\p{L}\p{N}]+/u).filter(x=>x.length>1)}function expand(ts){let out=[...ts];for(const t of ts){if(dict[t])out.push(...dict[t].map(norm))}return [...new Set(out)]}function score(p,ts,raw){const text=norm(JSON.stringify(p));let s=0,why=[];const title=norm(p.title),cat=norm(p.category),sub=norm((p.subcategories||[]).join(' ')),tags=norm((p.tags||[]).join(' ')),tool=norm(p.tool||p.model||p.target_tool||'');for(const t of ts){if(title.includes(t)){s+=12;why.push('العنوان')}if(cat.includes(t)){s+=9;why.push('المجال')}if(sub.includes(t)){s+=7;why.push('التصنيف')}if(tags.includes(t)){s+=8;why.push('الوسوم')}if(tool.includes(t)){s+=11;why.push('الأداة')}if(text.includes(t))s+=2}const q=Number(p.quality_score||0);s+=q*1.8;if(norm(raw).includes('افضل')||norm(raw).includes('احترافي'))s+=q*0.7;return {s,why:[...new Set(why)]}}function understand(q){const t=tokens(q),e=expand(t),models=['nano banana','midjourney','flux','runway','kling','sora','veo','stable diffusion','sdxl'].filter(x=>norm(q).includes(norm(x))),cats=['image','video','advertising','ads','photography','architecture','education','programming','data','content','food','portrait'].filter(x=>norm(q).includes(norm(x)));return {tokens:t,expanded:e,models,cats}}function render(){const q=$('q').value.trim();if(!q){$('intentText').textContent='اكتب طلبك للبدء';$('grid').innerHTML='<div class="empty">اكتب مثلًا: «إعلان مشروب غازي سينمائي لـ Nano Banana».</div>';return}const u=understand(q);$('intentText').textContent=(u.models.length?'الأداة: '+u.models.join('، ')+' — ':'')+(u.cats.length?'المجال: '+u.cats.join('، ')+' — ':'')+'الكلمات الموسعة: '+u.expanded.slice(0,10).join('، ');const L=P.map(p=>({p,...score(p,u.expanded,q)})).filter(x=>x.s>4).sort((a,b)=>b.s-a.s).slice(0,60);$('grid').innerHTML=L.length?L.map(x=>{const p=x.p;return '<article class="card"><span class="score">صلة '+Math.min(99,Math.round(x.s))+'% • جودة '+esc(p.quality_score||'—')+'/10</span><div class="meta"><span class="tag">'+esc(p.category||'عام')+'</span>'+((p.tags||[]).slice(0,4).map(t=>'<span class="tag">#'+esc(t)+'</span>').join(''))+'</div><h3>'+esc(p.title||'برومبت')+'</h3><div class="why">مطابقة بسبب: '+esc(x.why.join('، ')||'نص البرومبت')+'</div><div class="prompt">'+esc(p.prompt||'')+'</div><div class="actions"><button class="btn" data-copy="'+esc(p.id)+'">📋 نسخ</button><a class="btn accent" href="prompt-details.html?id='+encodeURIComponent(p.id)+'">📄 التفاصيل</a></div></article>'}).join(''):'<div class="empty">لم أجد نتيجة قوية. جرّب وصفًا أطول أو اسم الأداة.</div>'}document.querySelectorAll('.example').forEach(b=>b.onclick=()=>{$('q').value=b.textContent;render()});$('q').addEventListener('input',render);document.addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const p=P.find(x=>String(x.id)===String(b.dataset.copy));if(!p)return;try{await navigator.clipboard.writeText(p.prompt||'')}catch{const t=document.createElement('textarea');t.value=p.prompt||'';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}b.textContent='تم النسخ ✅';setTimeout(()=>b.textContent='📋 نسخ',1200)});fetch('data/prompts.json?'+Date.now()).then(r=>r.json()).then(d=>{P=d.prompts||d;render()}).catch(()=>{$('grid').innerHTML='<div class="empty">تعذر تحميل بيانات المكتبة.</div>'});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script><!-- MM_ARABIC_UI_V1 -->
<style id="mm-arabic-ui-style">
.mm-langbar{position:sticky;top:8px;z-index:50;display:flex;align-items:center;justify-content:center;gap:7px;margin:10px 0;padding:9px;background:#fff;border:1px solid #dbe3ef;border-radius:12px;box-shadow:0 4px 16px #00000010}.mm-langbar b{font-size:13px}.mm-langbar button{border:1px solid #cbd5e1;background:#f8fafc;color:#172033;border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:700}.mm-langbar button.active{background:#312e81;color:#fff;border-color:#312e81}.mm-lang-note{font-size:11px;color:#64748b}
</style>

<script id="mm-arabic-ui-script">
(()=>{
  if(window.__MM_ARABIC_UI__) return; window.__MM_ARABIC_UI__=true;
  const KEY='mm_prompt_language'; let lang=localStorage.getItem(KEY)||'ar'; let map=new Map();
  const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
  async function load(){try{const r=await fetch('./data/prompts.json?lang_ui='+Date.now(),{cache:'no-store'});const d=await r.json();(d.prompts||[]).forEach(p=>map.set(String(p.id),p));}catch(e){} render();}
  function getId(card){const b=card.querySelector('[data-details]');return b?String(b.getAttribute('data-details')):null;}
  function apply(){
    document.querySelectorAll('[data-mm-prompt]').forEach(el=>{const p=map.get(String(el.dataset.mmPrompt));if(!p)return;el.innerHTML=esc(lang==='ar'?(p.prompt_ar||p.prompt||''):(p.prompt||p.prompt_ar||''));});
    document.querySelectorAll('.mm-langbar button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
    const note=document.querySelector('.mm-lang-note');if(note)note.textContent=lang==='ar'?'العربية هي اللغة الافتراضية — الأصل الإنجليزي محفوظ':'English source is shown — الترجمة العربية محفوظة';
  }
  function scan(){document.querySelectorAll('article').forEach(card=>{const id=getId(card);if(!id)return;const p=card.querySelector('.prompt');if(p&&!p.dataset.mmPrompt){p.dataset.mmPrompt=id;}});apply();}
  function render(){scan();}
  function bar(){
    if(document.querySelector('.mm-langbar'))return;
    const bar=document.createElement('div');bar.className='mm-langbar';bar.innerHTML='<b>لغة البرومبت:</b><button data-lang="ar">🇪🇬 العربية</button><button data-lang="en">🇬🇧 English</button><span class="mm-lang-note"></span>';
    const main=document.querySelector('main')||document.body;main.prepend(bar);
    bar.querySelectorAll('button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem(KEY,lang);apply();});
  }
  bar(); load();
  new MutationObserver(()=>scan()).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body></html>
