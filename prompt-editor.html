<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرر البرومبت | مكتبة مسعد ماهر</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:24px 16px;text-align:center}header h1{margin:0 0 8px}.wrap{max-width:1100px;margin:auto;padding:18px}.bar,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:14px}.back{color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.field{border:1px solid #e5e7eb;border-radius:12px;padding:12px}.field label{font-weight:bold;display:block;margin-bottom:7px}.field select,.field input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}textarea{min-height:220px;line-height:1.8}.btn{border:0;border-radius:9px;padding:11px 15px;margin:5px;cursor:pointer;background:#111827;color:#fff}.btn.alt{background:#475569}.btn.ok{background:#166534}.hint{font-size:12px;color:#64748b;margin-top:6px}.score{display:inline-block;padding:6px 10px;border-radius:999px;background:#ecfdf5;color:#166534;font-weight:bold}.source{font-size:13px;color:#64748b}.notice{padding:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;margin-top:10px}@media(max-width:650px){.wrap{padding:12px}}</style></head><body><header><h1>🛠️ محرر البرومبت الذكي</h1><p>عدّل كل عنصر من خلال اختيارات جاهزة أو قيمة مخصصة</p><a class="back" href="index.html">← العودة إلى المكتبة</a></header><main class="wrap"><div class="bar"><div id="title">جاري التحميل...</div><div id="meta"></div><button class="btn alt" onclick="location.href='prompt-generator.html'">🧠 المولد العام</button></div><section class="panel"><h2>1) قاعدة بناء البرومبت</h2><p id="formula"></p><div class="notice">غيّر أي عنصر من الاختيارات بالأسفل. الناتج يتحدث تلقائيًا، ويمكنك بعد ذلك نسخه أو تصديره.</div></section><section class="panel"><h2>2) تعديل العناصر</h2><div class="grid" id="fields"></div></section><section class="panel"><h2>3) البرومبت المعدّل</h2><textarea id="output"></textarea><button class="btn ok" onclick="copyText()">📋 نسخ</button><button class="btn" onclick="downloadTxt()">⬇️ TXT</button><button class="btn" onclick="downloadMd()">⬇️ Markdown</button><button class="btn alt" onclick="resetPrompt()">↺ الأصلي</button></section><section class="panel"><h2>4) الصورة</h2><input id="imageUrl" placeholder="ضع رابط صورة البرومبت هنا للمعاينة"><button class="btn" onclick="showImage()">عرض الصورة</button><div id="imageBox"></div></section></main><script>let p=null,original='';const imageOptions={الموضوع:['بورتريه لشخص','منتج إعلاني','شخصية سينمائية','سيارة فاخرة','طعام فاخر','منظر طبيعي','مبنى معماري','مخصص'],الوضعية:['أمامية','جانبية','زاوية 3/4','واقف','جالس','حركة ديناميكية','لقطة قريبة للوجه','مخصص'],البيئة:['استوديو احترافي','شارع حضري','مدينة ليلية','طبيعة','شاطئ','صحراء','مكتب فاخر','منزل فاخر','مخصص'],التكوين:['تمركز في المنتصف','قاعدة الأثلاث','تكوين متماثل','Close-up','Wide Shot','زاوية منخفضة','زاوية علوية','مخصص'],الكاميرا:['24mm Wide Angle','35mm Cinematic','50mm Standard','85mm Portrait','100mm Macro','Telephoto','مخصص'],الإضاءة:['Softbox ناعمة','إضاءة ثلاثية النقاط','Golden Hour','Rim Light','Chiaroscuro درامية','Neon Cinematic','Volumetric Light','مخصص'],الأسلوب:['واقعي فوتوغرافي','سينمائي','إعلان فاخر','Editorial Fashion','3D عالي الجودة','Anime','سريالي','Concept Art','مخصص'],التفاصيل:['ملمس جلد واقعي','تفاصيل الأقمشة','انعكاسات واقعية','ظلال دقيقة','ضباب جوي','تفاصيل فائقة','مواد وخامات دقيقة','مخصص'],القيود:['بدون تشوهات','بدون أصابع زائدة','بدون نصوص','بدون علامة مائية','حافظ على ملامح الهوية','نِسب جسم طبيعية','مخصص'],الناتج:['4K عالي الدقة','8K فائق الدقة','1:1','4:5','16:9','9:16','جاهز للطباعة','مخصص']};const videoOptions={الموضوع:imageOptions.الموضوع,الحركة:['مشي طبيعي','جري سريع','التفاتة بطيئة','حركة يد طبيعية','دوران المنتج','حركة سينمائية بطيئة','Slow Motion','مخصص'],البيئة:['استوديو','شارع حضري','مدينة ليلية','طبيعة','شاطئ','صحراء','مكتب فاخر','مخصص'],حركة_الكاميرا:['Dolly In','Dolly Out','Tracking Shot','Orbit 360°','Pan','Tilt','Crane Shot','Handheld ناعم','مخصص'],الحركة_البيئية:['رياح خفيفة','مطر','غبار','دخان متحرك','حركة القماش','حركة المرور','أوراق متطايرة','مخصص'],التوقيت:['5 ثوانٍ','8 ثوانٍ','10 ثوانٍ','إيقاع سينمائي بطيء','إيقاع سريع وديناميكي','انتقال سلس','مخصص'],الإضاءة:imageOptions.الإضاءة,الأسلوب:['واقعي سينمائي','إعلان فاخر','وثائقي','Action Cinematic','3D','سريالي','Editorial','مخصص'],الصوت:['بدون صوت','موسيقى سينمائية','مؤثرات بيئية','صوت خطوات','صوت حركة واقعي','تعليق صوتي','مخصص'],القيود:['حركة طبيعية','ثبات ملامح الشخصية','بدون تشوهات','بدون عناصر إضافية','بدون نصوص أو علامة مائية','انتقالات سلسة','مخصص']};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function infer(){let f=p.template||'';return f.includes('الحركة البيئية')?videoOptions:imageOptions}function renderFields(){const opts=infer();const names=(p.template||'').split('→').map(x=>x.trim()).filter(Boolean);document.getElementById('fields').innerHTML=names.map((n,i)=>{const key=n.replaceAll(' ','_');const list=opts[n]||opts[key]||['مخصص'];let value=(p.prompt||'').split('→')[i]||'';return `<div class="field"><label>${i+1}. ${esc(n)}</label><select id="s${i}" onchange="customize(${i})">${list.map(x=>`<option ${value.includes(x)?'selected':''}>${esc(x)}</option>`).join('')}</select><input id="c${i}" placeholder="اكتب قيمة ${esc(n)} مخصصة" style="display:none" oninput="build()"><div class="hint">الاختيار بين القوسين هو الجزء الذي يمكنك تغييره دون إعادة كتابة البرومبت كله.</div></div>`}).join('');document.querySelectorAll('select').forEach((s,i)=>{if(s.value==='مخصص')document.getElementById('c'+i).style.display='block'});build()}function customize(i){const s=document.getElementById('s'+i),c=document.getElementById('c'+i);c.style.display=s.value==='مخصص'?'block':'none';build()}function build(){const names=(p.template||'').split('→').map(x=>x.trim()).filter(Boolean);document.getElementById('output').value=names.map((n,i)=>{const s=document.getElementById('s'+i),c=document.getElementById('c'+i);return `${n}: ${s?.value==='مخصص'?(c?.value||'غير محدد'):s?.value||''}`}).join(' → ')}function copyText(){navigator.clipboard.writeText(document.getElementById('output').value).then(()=>alert('تم النسخ ✅'))}function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function downloadTxt(){download((p.id||'prompt')+'.txt',document.getElementById('output').value,'text/plain')}function downloadMd(){download((p.id||'prompt')+'.md',`# ${p.title}\n\n${document.getElementById('output').value}`,'text/markdown')}function resetPrompt(){document.getElementById('output').value=original}function showImage(){const u=document.getElementById('imageUrl').value.trim();document.getElementById('imageBox').innerHTML=u?`<img src="${esc(u)}" style="max-width:100%;margin-top:12px;border-radius:12px" onerror="this.outerHTML='<p>تعذر تحميل الصورة من الرابط.</p>'">`:''}async function load(){const id=new URLSearchParams(location.search).get('id');try{const r=await fetch('data/prompts.json',{cache:'no-store'});const d=await r.json();const arr=Array.isArray(d)?d:d.prompts||[];p=arr.find(x=>x.id===id)||arr[0];if(!p)throw Error('empty');original=p.prompt||'';document.getElementById('title').innerHTML=`<h2>${esc(p.title)}</h2><span class="score">جودة: ${esc(p.quality_score||'8+')}/10</span>`;document.getElementById('meta').innerHTML=`<p class="source">المجال: ${esc(p.category)} | المصدر: ${esc(p.source||'مكتبة مسعد ماهر')}</p>`;document.getElementById('formula').textContent=p.template||'قاعدة بناء غير محددة';renderFields()}catch(e){document.getElementById('title').textContent='تعذر تحميل البرومبت'}}load();</script></body></html>
