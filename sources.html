<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مصادر مكتبة مسعد ماهر</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:28px 18px;text-align:center}header h1{margin:0 0 8px}header p{margin:0;color:#cbd5e1}.wrap{max-width:1150px;margin:auto;padding:22px}.top{display:grid;grid-template-columns:1fr auto auto;gap:12px;margin-bottom:16px}.search{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px}.back,.add{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:14px;text-decoration:none;color:#172033}.add{background:#111827;color:#fff}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.filters button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.filters button.active{background:#111827;color:#fff}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:#64748b;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 4px 14px #00000008}.type{display:inline-block;background:#eef2ff;border-radius:8px;padding:5px 8px;font-size:12px}.card h3{margin:12px 0 8px}.card p{color:#64748b;font-size:13px;line-height:1.6}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{background:#f1f5f9;border-radius:7px;padding:5px 7px;font-size:11px}.visit{display:block;text-align:center;margin-top:14px;padding:11px;border-radius:9px;background:#111827;color:#fff;text-decoration:none}.empty{text-align:center;padding:50px;color:#64748b}.loading{text-align:center;padding:50px;color:#64748b}@media(max-width:700px){.top{grid-template-columns:1fr}.back,.add{text-align:center}}</style></head><body><header><h1>🌐 مصادر مكتبة مسعد ماهر</h1><p>المصادر المعتمدة لاكتشاف وتطوير البرومبتات وأدوات الذكاء الاصطناعي.</p></header><main class="wrap"><div class="top"><input id="search" class="search" placeholder="🔎 ابحث عن مصدر أو مجال..." oninput="render()"><a class="add" href="source-manager.html">➕ إضافة مصدر</a><a class="back" href="index.html">📚 العودة للمكتبة</a></div><div id="filters" class="filters"></div><div class="bar"><span id="count">جارٍ التحميل...</span><span>مصادر مرتبة حسب الأولوية</span></div><section id="grid" class="grid"><div class="loading">جارٍ تحميل المصادر...</div></section></main><script>let sources=[];let active='الكل';const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function setCat(c){active=c;render()}function render(){const types=['الكل',...new Set(sources.map(s=>s.type))];document.getElementById('filters').innerHTML=types.map(c=>`<button class="${c===active?'active':''}" onclick="setCat('${esc(c)}')">${esc(c)}</button>`).join('');const q=document.getElementById('search').value.toLowerCase().trim();const list=sources.filter(s=>(active==='الكل'||s.type===active)&&(`${s.name} ${s.type} ${s.focus.join(' ')}`).toLowerCase().includes(q)).sort((a,b)=>({critical:0,high:1,normal:2}[a.priority]??3)-({critical:0,high:1,normal:2}[b.priority]??3));document.getElementById('count').textContent=`عدد النتائج: ${list.length} من ${sources.length}`;document.getElementById('grid').innerHTML=list.length?list.map(s=>`<article class="card"><span class="type">${esc(s.type)}</span><h3>${esc(s.name)}</h3><p>الأولوية: <b>${esc(s.priority)}</b></p><div class="tags">${s.focus.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><a class="visit" href="${esc(s.url)}" target="_blank" rel="noopener">زيارة المصدر ↗</a></article>`).join(''):'<div class="empty">لا توجد مصادر مطابقة.</div>'}async function load(){try{const r=await fetch('data/sources.json');if(!r.ok)throw new Error('load');const d=await r.json();sources=d.sources||[];render()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">تعذر تحميل قاعدة بيانات المصادر. تأكد من تشغيل الموقع عبر GitHub Pages.</div>';document.getElementById('count').textContent='خطأ في التحميل'}}load();</script></body></html>
