<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة مسعد ماهر Pro</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}header{background:linear-gradient(135deg,#111827,#4338ca);color:#fff;padding:32px 18px;text-align:center}.wrap{max-width:1350px;margin:auto;padding:16px}.nav,.filters,.stats{display:grid;gap:9px}.nav{grid-template-columns:repeat(6,1fr);margin-bottom:12px}.nav a,.panel,.stat,.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px}.nav a{text-align:center;padding:12px}.nav span{display:block;color:#64748b;font-size:11px}.panel{padding:16px;margin-bottom:12px}.search{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}.filters{grid-template-columns:repeat(5,1fr);margin-top:9px}.filters select{padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff}.stats{grid-template-columns:repeat(5,1fr);margin:12px 0}.stat{padding:12px}.stat b{display:block;font-size:22px;margin-top:4px}.stat small{color:#64748b}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#172033;color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}.btn.alt{background:#e8edf5;color:#172033}.btn.accent{background:#4f46e5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px}.card{padding:16px;box-shadow:0 4px 16px #00000007}.card h3{margin:9px 0}.tag{display:inline-block;background:#eef2ff;padding:5px 8px;border-radius:8px;font-size:11px}.quality{float:left;background:#ecfdf5;padding:5px 7px;border-radius:8px;font-size:11px}.fav{float:left;border:0;background:none;font-size:22px;cursor:pointer}.prompt{background:#f8fafc;border:1px dashed #cbd5e1;padding:11px;border-radius:10px;line-height:1.7;font-size:13px;max-height:170px;overflow:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.empty{text-align:center;padding:50px;color:#64748b}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{border:1px solid #dbe3ef;background:#f8fafc;border-radius:999px;padding:7px 10px;cursor:pointer;font-size:11px}@media(max-width:850px){.nav{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.filters,.stats,.nav{grid-template-columns:1fr}}</style></head><body><header><h1>📚 مكتبة مسعد ماهر Pro</h1><p>بحث متقدم + جودة + تصنيف + مفضلة + تصدير + صفحات تفاصيل مستقلة</p></header><main class="wrap"><nav class="nav"><a href="index.html">📚<b>الرئيسية</b><span>المنصة</span></a><a href="library-pro.html">🚀<b>المكتبة</b><span>الكتالوج</span></a><a href="prompt-generator.html">🧠<b>المولد</b><span>إنشاء</span></a><a href="prompt-editor.html">🛠️<b>المحرر</b><span>تعديل</span></a><a href="add-prompt.html">➕<b>إضافة</b><span>برومبت جديد</span></a><a href="sources.html">🌐<b>المصادر</b><span>المراجع</span></a></nav><section class="panel"><h2>مركز البحث والعمل</h2><input id="q" class="search" placeholder="🔎 ابحث في العنوان أو البرومبت أو المجال أو الوسوم..." oninput="render()"><div class="filters"><select id="cat" onchange="render()"><option value="">كل المجالات</option></select><select id="sub" onchange="render()"><option value="">كل التصنيفات</option></select><select id="source" onchange="render()"><option value="">كل المصادر</option></select><select id="quality" onchange="render()"><option value="">كل الجودة</option><option value="10">10</option><option value="9">9+</option><option value="8">8+</option></select><select id="sort" onchange="render()"><option value="new">الأحدث</option><option value="quality">الأعلى جودة</option><option value="title">أبجديًا</option></select></div><div id="chips" class="chips"></div><div class="toolbar"><button class="btn accent" onclick="randomPrompt()">🎲 عشوائي</button><button class="btn alt" onclick="favMode=true;render()">⭐ المفضلة</button><button class="btn alt" onclick="favMode=false;render()">📚 الكل</button><button class="btn alt" onclick="clearAll()">↺ مسح</button><button class="btn alt" onclick="downloadJSON()">⬇️ JSON</button><button class="btn alt" onclick="downloadCSV()">⬇️ CSV</button></div></section><section class="stats"><div class="stat">📦<small>العدد</small><b id="total">...</b></div><div class="stat">🗂️<small>المجالات</small><b id="cats">...</b></div><div class="stat">⭐<small>المفضلة</small><b id="favc">...</b></div><div class="stat">🎯<small>النتائج</small><b id="res">...</b></div><div class="stat">🏆<small>متوسط الجودة</small><b id="avg">...</b></div></section><section id="grid" class="grid"><div class="empty">جاري التحميل...</div></section></main><script>let P=[],F=JSON.parse(localStorage.getItem('mm_favorites')||'[]'),favMode=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeId=id=>encodeURIComponent(String(id??''));const vals=k=>[...new Set(P.flatMap(x=>Array.isArray(x[k])?x[k]:[x[k]]).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'ar'));function fill(id,a,label){document.getElementById(id).innerHTML='<option value="">'+label+'</option>'+a.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')}function isFav(id){return F.includes(id)}function toggle(id){F=isFav(id)?F.filter(x=>x!==id):[...F,id];localStorage.setItem('mm_favorites',JSON.stringify(F));render()}function cp(id){let p=P.find(x=>x.id===id);if(p)navigator.clipboard.writeText(p.prompt||'').then(()=>alert('تم النسخ ✅'))}function details(id){location.href='prompt-details.html?id='+safeId(id)}function randomPrompt(){if(P.length)details(P[Math.floor(Math.random()*P.length)].id)}function clearAll(){['q','cat','sub','source','quality'].forEach(x=>document.getElementById(x).value='');favMode=false;history.replaceState(null,'','library-pro.html');render()}function render(){let q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('cat').value,s=document.getElementById('sub').value,src=document.getElementById('source').value,min=Number(document.getElementById('quality').value||0),sort=document.getElementById('sort').value;let L=P.filter(p=>{let h=JSON.stringify(p).toLowerCase();return(!favMode||isFav(p.id))&&(!q||h.includes(q))&&(!c||p.category===c)&&(!s||(p.subcategories||[]).includes(s))&&(!src||p.source===src)&&(!min||Number(p.quality_score||0)>=min)});if(sort==='quality')L.sort((a,b)=>Number(b.quality_score||0)-Number(a.quality_score||0));if(sort==='title')L.sort((a,b)=>String(a.title).localeCompare(String(b.title),'ar'));document.getElementById('total').textContent=P.length;document.getElementById('cats').textContent=vals('category').length;document.getElementById('favc').textContent=F.length;document.getElementById('res').textContent=L.length;let qv=P.map(x=>Number(x.quality_score||0)).filter(x=>x);document.getElementById('avg').textContent=qv.length?(qv.reduce((a,b)=>a+b,0)/qv.length).toFixed(1)+'/10':'—';document.getElementById('grid').innerHTML=L.length?L.map(p=>'<article class="card"><button class="fav" onclick="toggle('+JSON.stringify(String(p.id))+')">'+(isFav(p.id)?'⭐':'☆')+'</button><span class="quality">⭐ '+esc(p.quality_score||'—')+'/10</span><span class="tag">'+esc(p.category||'عام')+'</span><h3>'+esc(p.title||'برومبت')+'</h3><p>'+((p.tags||[]).map(x=>'#'+esc(x)).join(' '))+'</p><div class="prompt">'+esc(p.prompt||'')+'</div><div class="actions"><button class="btn" onclick="cp('+JSON.stringify(String(p.id))+')">📋 نسخ</button><button class="btn accent" onclick="details('+JSON.stringify(String(p.id))+')">📄 صفحة التفاصيل</button></div></article>').join(''):'<div class="empty">لا توجد نتائج.</div>'}function chips(){document.getElementById('chips').innerHTML=vals('category').map(x=>'<button class="chip" onclick="setCategory('+JSON.stringify(x)+')">'+esc(x)+'</button>').join('')}function setCategory(x){document.getElementById('cat').value=x;history.replaceState(null,'','library-pro.html?category='+encodeURIComponent(x));render()}function readQuery(){let u=new URLSearchParams(location.search),q=u.get('q')||'',category=u.get('category')||'';document.getElementById('q').value=q;if(category)document.getElementById('cat').value=category}function downloadJSON(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(P,null,2)],{type:'application/json'}));a.download='masad-maher-professional-prompts.json';a.click()}function downloadCSV(){let r=[['id','title','category','tags','quality','prompt'],...P.map(p=>[p.id,p.title,p.category,(p.tags||[]).join('|'),p.quality_score||'',p.prompt||''])];let c='\ufeff'+r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='masad-maher-professional-prompts.csv';a.click()}async function load(){try{let [a,b]=await Promise.all([fetch('data/prompts.json?'+Date.now()).then(x=>x.json()),fetch('data/professional-catalog.json?'+Date.now()).then(x=>x.json())]);P=[...(a.prompts||a),...(b.prompts||b)];fill('cat',vals('category'),'كل المجالات');fill('sub',vals('subcategories'),'كل التصنيفات');fill('source',vals('source'),'كل المصادر');readQuery();chips();render()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">تعذر تحميل الكتالوج.</div>'}}load();</script></body></html>
