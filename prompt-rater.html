<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقيّم البرومبت — مكتبة مسعد ماهر</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}.hero{background:linear-gradient(135deg,#111827,#4338ca);color:#fff;padding:30px;text-align:center}.wrap{max-width:950px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:14px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.nav a{background:#fff;padding:10px 12px;border-radius:10px;text-decoration:none;color:#172033;border:1px solid #e2e8f0}textarea,input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:9px;margin-top:6px;font:inherit}.score{font-size:42px;font-weight:900;text-align:center;margin:15px}.row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eef2f7}.good{color:#166534}.warn{color:#9a3412}.btn{border:0;border-radius:10px;padding:11px 15px;background:#4f46e5;color:#fff;cursor:pointer;margin:4px}.alt{background:#e8edf5;color:#172033}.result{background:#f8fafc;padding:14px;border-radius:11px;line-height:1.8}.muted{color:#64748b;line-height:1.8}</style></head><body><header class="hero"><h1>🏆 مقيّم البرومبت الاحترافي</h1><p>قياس تلقائي أولي + توصيات تحسين قبل إرسال البرومبت للمكتبة.</p></header><main class="wrap"><nav class="nav"><a href="library-final.html">🏠 الرئيسية</a><a href="library-pro.html">📚 المكتبة</a><a href="prompt-engineer.html">🤖 المهندس</a><a href="community.html">👥 المجتمع</a></nav><section class="card"><label>البرومبت</label><textarea id="p" placeholder="ألصق البرومبت هنا..."></textarea><label>نوع المهمة</label><select id="type"><option>صورة</option><option>فيديو</option><option>إعلان</option><option>كتابة</option><option>تعليم</option><option>بيانات</option><option>برمجة</option><option>مقاولات</option></select><button class="btn" onclick="rate()">⚡ قيّم وحسّن</button></section><section class="card"><div id="score" class="score">—</div><div id="rows"></div></section><section class="card"><h2>✨ توصيات التحسين</h2><div id="tips" class="result">—</div><button class="btn" onclick="copyImproved()">📋 نسخ النسخة المحسنة</button><a class="btn alt" href="prompt-engineer.html">🤖 فتح المهندس</a></section></main><script>let improved='';function rate(){const p=document.getElementById('p').value.trim();if(!p)return alert('اكتب البرومبت أولًا');const t=document.getElementById('type').value;let checks=[['وضوح المهمة',p.length>=60],['تحديد الهدف',/هدف|المطلوب|أنشئ|اكتب|حلل|create|generate/i.test(p)],['السياق',/سياق|خلفية|context|background/i.test(p)],['المخرجات',/ناتج|مخرجات|صيغة|format|output|جدول/i.test(p)],['القيود',/بدون|لا |قيود|constraint|avoid|negative/i.test(p)],['تفاصيل قابلة للقياس',/4k|16:9|9:16|4:5|1080|ثوان|درجة|عدد|نسبة/i.test(p)]];let n=checks.filter(x=>x[1]).length,sc=Math.round(4+n);document.getElementById('score').textContent=sc+'/10';document.getElementById('rows').innerHTML=checks.map(x=>'<div class="row"><span>'+x[0]+'</span><b class="'+(x[1]?'good':'warn')+'">'+(x[1]?'✓ موجود':'⚠ يحتاج تحسين')+'</b></div>').join('');let missing=checks.filter(x=>!x[1]).map(x=>x[0]);let tips=missing.length?'أضف: '+missing.join('، ')+'.':'الهيكل جيد. حسّن الدقة بإضافة قيم قابلة للقياس وقيود واضحة.';improved=p+'\n\n[تحسينات مقترحة]\nنوع المهمة: '+t+'\nالهدف: نتيجة واضحة وقابلة للاستخدام.\nالقيود: لا تضف معلومات غير مطلوبة، وحافظ على الاتساق والدقة.\nالناتج: قدم النتيجة بصيغة منظمة وقابلة للتنفيذ.';document.getElementById('tips').textContent=tips+'\n\nنسخة محسنة جاهزة:\n'+improved}async function copyImproved(){if(!improved)return alert('قيّم البرومبت أولًا');try{await navigator.clipboard.writeText(improved)}catch(_){let x=document.createElement('textarea');x.value=improved;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}alert('تم النسخ ✅')}</script></body></html>
