<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحساب — مكتبة مسعد ماهر</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172033}.wrap{max-width:520px;margin:40px auto;padding:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0000000b}.hero{text-align:center;margin-bottom:18px}.hero h1{margin:0 0 8px}.muted{color:#64748b;font-size:14px}label{display:block;font-weight:bold;font-size:13px;margin-top:12px}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:12px 16px;background:#4f46e5;color:#fff;cursor:pointer;margin-top:14px;width:100%;font:inherit}.alt{background:#e8edf5;color:#172033}.status{margin-top:14px;padding:10px;border-radius:10px;background:#f8fafc;min-height:20px}.ok{color:#166534}.err{color:#b91c1c}.nav{text-align:center;margin-top:18px}.nav a{color:#4338ca;text-decoration:none;margin:0 6px}@media(max-width:600px){.wrap{margin:15px auto}}
</style></head><body><main class="wrap"><section class="hero"><h1>🔐 حساب المكتبة</h1><p class="muted">حساب مركزي لمزامنة بياناتك بين الهاتف والكمبيوتر.</p></section><section class="card"><div id="logged" hidden><h2>أنت مسجل الدخول ✅</h2><p id="who" class="muted"></p><button class="btn" onclick="signOut()">تسجيل الخروج</button></div><div id="form"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"><button class="btn" onclick="login()">تسجيل الدخول</button><button class="btn alt" onclick="signup()">إنشاء حساب جديد</button><div id="status" class="status"></div></div></section><div class="nav"><a href="library-final.html">الرئيسية</a> · <a href="profile.html">ملفي</a> · <a href="collections.html">مجموعاتي</a></div></main><script type="module">import {supabase} from './supabase-client.js';const $=id=>document.getElementById(id);function msg(t,c=''){ $('status').innerHTML='<span class="'+c+'">'+t+'</span>'}async function refresh(){const {data:{session}}=await supabase.auth.getSession();if(session){$('form').hidden=true;$('logged').hidden=false;$('who').textContent=session.user.email||'حساب المستخدم'}else{$('form').hidden=false;$('logged').hidden=true}}window.login=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('اكتب البريد وكلمة المرور.','err');const {error}=await supabase.auth.signInWithPassword({email,password});if(error)return msg(error.message,'err');msg('تم تسجيل الدخول بنجاح.','ok');await refresh()};window.signup=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return msg('اكتب بريدًا صحيحًا وكلمة مرور من 6 أحرف على الأقل.','err');const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return msg(error.message,'err');if(data.session){msg('تم إنشاء الحساب وتسجيل الدخول.','ok');await refresh()}else msg('تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيد الحساب.','ok')};window.signOut=async()=>{await supabase.auth.signOut();await refresh()};supabase.auth.onAuthStateChange(()=>refresh());refresh();</script></body></html>
